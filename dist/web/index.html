  "use strict";
  const ZS = window.ZS;
  const { h, pct, num, team, D } = ZS;
  const ui = () => ZS.ui;

  const FORMATS = { "9:16": [1080, 1920], "4:5": [1080, 1350], "1:1": [1080, 1080] };
  const TEMPLATES = [
    ["prediction", "توقع مباراة"], ["ht", "نهاية الشوط"], ["ft", "نهاية المباراة"], ["race", "سباق اللقب"], ["compare", "مقارنة فريقين"], ["story", "قصة من الأرقام"],
  ];
  const BRAND_AR = "حاسوب زهراء الكروي";
  const SHIELD = "M20 1L38 6v16c0 12-8 20-18 24C10 42 2 34 2 22V6z";
  const FONT_D = '"Changa Local", "Changa", "Cairo Local", "Cairo", sans-serif';
  const FONT_B = '"Cairo Local", "Cairo", sans-serif';

  // ------------------------------------------------------------------ canvas helpers
  function font(weight, size, display = false) { return `${weight} ${size}px ${display ? FONT_D : FONT_B}`; }
  function wrapLines(ctx, text, maxW) {
    const words = String(text || "").split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
      const t = cur ? cur + " " + w : w;
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function text(ctx, str, x, y, { size = 40, weight = 700, color = "#fff", align = "right", display = false, maxW = 0, lh = 1.35, maxLines = 99 } = {}) {
    ctx.font = font(weight, size, display);
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.direction = "rtl";
    ctx.textBaseline = "alphabetic";
    if (!maxW) { ctx.fillText(str, x, y); return y; }
    let lines = wrapLines(ctx, str, maxW);
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] += "…"; }
    lines.forEach((l, i) => ctx.fillText(l, x, y + i * size * lh));
    return y + (lines.length - 1) * size * lh;
  }
  function ltrText(ctx, str, x, y, size, color, align = "center", weight = 800) {
    ctx.font = font(weight, size, true);
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.direction = "ltr";
    ctx.fillText(str, x, y);
  }
  function roundRect(ctx, x, y, w, h_, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h_, r) : ctx.rect(x, y, w, h_); }
  function drawCrest(ctx, id, x, y, w) {
    const t = team(id);
    const s = w / 40;
    const k0 = (t.kit && t.kit[0]) || t.color, k1 = (t.kit && t.kit[1]) || "#ffffff";
    const pat = { ATM: "stripes", BAR: "stripes", ATH: "stripes", RBB: "stripes", ESP: "stripes", DEP: "stripes", MCF: "stripes", RSO: "stripes", LEV: "stripes", ALA: "stripes", GIR: "stripes", RVC: "sash", ELC: "band" }[t.id] || "plain";
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    const p = new Path2D(SHIELD);
    ctx.save(); ctx.clip(p);
    ctx.fillStyle = k0; ctx.fillRect(0, 0, 40, 47);
    ctx.fillStyle = k1;
    if (pat === "stripes") for (let i = 1; i < 8; i += 2) ctx.fillRect(i * 5, 0, 5, 47);
    else if (pat === "sash") { ctx.beginPath(); ctx.moveTo(-4, 36); ctx.lineTo(36, -4); ctx.lineTo(46, 4); ctx.lineTo(6, 46); ctx.fill(); }
    else if (pat === "band") ctx.fillRect(0, 14, 40, 11);
    ctx.fillStyle = "rgba(11,15,12,.72)"; ctx.fillRect(0, 29, 40, 11);
    ctx.font = font(800, 8.4, true); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.direction = "ltr";
    ctx.fillText(t.id, 20, 37.6);
    ctx.restore();
    ctx.lineWidth = 1.4; ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.stroke(p);
    ctx.restore();
  }
  function background(ctx, W, H, accent) {
    ctx.fillStyle = "#0e1310"; ctx.fillRect(0, 0, W, H);
    // mowing stripes and chalk lines of a pitch, very faint
    for (let i = 0; i < 12; i++) if (i % 2) { ctx.fillStyle = "rgba(52,180,108,.035)"; ctx.fillRect(0, (H / 12) * i, W, H / 12); }
    ctx.strokeStyle = "rgba(232,238,233,.07)"; ctx.lineWidth = 4;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    ctx.beginPath(); ctx.moveTo(40, H / 2); ctx.lineTo(W - 40, H / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 150, 0, Math.PI * 2); ctx.stroke();
    // accent bar at the top
    ctx.fillStyle = accent; ctx.fillRect(0, 0, W, 14);
  }
  function header(ctx, W, label, accent) {
    // brand mark: a small pitch with the centre circle
    roundRect(ctx, W - 80 - 64, 70, 64, 64, 14); ctx.fillStyle = "#34b46c"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(W - 80 - 32, 102, 15, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W - 80 - 32, 76); ctx.lineTo(W - 80 - 32, 128); ctx.stroke();
    text(ctx, BRAND_AR, W - 80 - 84, 112, { size: 36, weight: 800, display: true });
    // template label pill
    ctx.font = font(800, 30, true);
    const lw = ctx.measureText(label).width + 48;
    roundRect(ctx, 80, 72, lw, 58, 29); ctx.fillStyle = accent; ctx.fill();
    text(ctx, label, 80 + lw - 24, 112, { size: 30, weight: 800, color: ZS.inkOn(accent.startsWith("#") ? accent : "#34b46c"), display: true });
  }
  function footer(ctx, W, H, m) {
    ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.fillRect(0, H - 190, W, 190);
    if (m.handle) {
      const rtlHandle = /[\u0600-\u06FF]/.test(m.handle);
      if (rtlHandle) text(ctx, m.handle, W - 80, H - 128, { size: 34, weight: 800, display: true });
      else ltrText(ctx, m.handle, W - 80, H - 128, 34, "#ffffff", "right");
    }
    text(ctx, `المصدر: ${m.source}`, W - 80, H - 82, { size: 24, weight: 600, color: "rgba(255,255,255,.72)", maxW: W - 160, maxLines: 1 });
    ctx.direction = "ltr"; ctx.textAlign = "right"; ctx.font = font(600, 21); ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillText(`${m.version} · ${m.updated}`, W - 80, H - 44);
  }
  function probRow(ctx, x, y, w, p, cols, labels) {
    let cx = x + w; // right to left
    const gap = 8, avail = w - 2 * gap;
    p.forEach((v, i) => {
      const sw = Math.max(6, avail * v);
      roundRect(ctx, cx - sw, y, sw, 34, 8); ctx.fillStyle = cols[i]; ctx.fill();
      cx -= sw + gap;
    });
    // numbers under the bar
    const pos = [x + w, x + w / 2, x];
    const al = ["right", "center", "left"];
    p.forEach((v, i) => {
      ctx.font = font(800, 76, true); ctx.fillStyle = i === 1 ? "rgba(255,255,255,.85)" : "#fff"; ctx.textAlign = al[i]; ctx.direction = "ltr";
      ctx.fillText(`${Math.round(100 * v)}%`, pos[i], y + 120);
      ctx.font = font(700, 28); ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.direction = "rtl";
      ctx.fillText(labels[i], pos[i], y + 166);
    });
  }

  // ------------------------------------------------------------------ card drawing per template
  function drawCard(canvas, m) {
    const [W, H] = FORMATS[m.format];
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    background(ctx, W, H, m.accent);
    header(ctx, W, m.label, m.accent);
    // measure the content once off screen, then centre it between the header and the footer
    const probe = document.createElement("canvas");
    probe.width = W; probe.height = H;
    const top = 200, bottom = H - 220;
    const used = drawContent(probe.getContext("2d"), W, H, m, top) - top;
    const offset = Math.max(0, (bottom - top - used) / 2);
    drawContent(ctx, W, H, m, top + offset);
    footer(ctx, W, H, m);
  }
  function drawContent(ctx, W, H, m, y0) {
    const tall = H / W > 1.5, square = H === W;
    let y = y0 + 70;
    y = text(ctx, m.title, W - 80, y, { size: tall ? 68 : 56, weight: 800, display: true, maxW: W - 160, maxLines: 3, lh: 1.25 }) + (tall ? 64 : 50);
    if (m.subtitle) y = text(ctx, m.subtitle, W - 80, y, { size: tall ? 34 : 30, weight: 600, color: "rgba(255,255,255,.78)", maxW: W - 160, maxLines: 3 }) + (tall ? 70 : 46);
    const d = m.data || {};
    if (m.template === "prediction" || m.template === "ht" || m.template === "ft") {
      const cy = y;
      const cw = square ? 150 : tall ? 230 : 190;
      drawCrest(ctx, d.home, W - 80 - cw, cy, cw);
      drawCrest(ctx, d.away, 80, cy, cw);
      const nameY = cy + cw * 1.175 + 56;
      text(ctx, team(d.home).ar, W - 80 - cw / 2, nameY, { size: tall ? 40 : 36, weight: 800, align: "center", display: true });
      text(ctx, team(d.away).ar, 80 + cw / 2, nameY, { size: tall ? 40 : 36, weight: 800, align: "center", display: true });
      if (d.score) {
        ltrText(ctx, `${d.score[1]}  –  ${d.score[0]}`, W / 2, cy + cw * 0.72, square ? 120 : 160, "#fff");
        if (d.scoreNote) text(ctx, d.scoreNote, W / 2, cy + cw * 0.72 + 66, { size: 28, weight: 700, align: "center", color: "rgba(255,255,255,.75)" });
      } else if (d.time) {
        ltrText(ctx, d.time, W / 2, cy + cw * 0.6, tall ? 96 : 84, "#fff");
        text(ctx, d.dateText || "", W / 2, cy + cw * 0.6 + 58, { size: 28, weight: 700, align: "center", color: "rgba(255,255,255,.75)" });
      }
      y = nameY + (square ? 60 : 90);
      if (d.p) {
        const [hc, ac] = ZS.pairColours(team(d.home), team(d.away));
        probRow(ctx, 80, y, W - 160, d.p, [hc, "#7d8a83", ac], [`فوز ${team(d.home).short || team(d.home).ar}`, "تعادل", `فوز ${team(d.away).short || team(d.away).ar}`]);
        y += square ? 230 : 260;
      }
      for (const line of (d.lines || []).slice(0, square ? 2 : tall ? 4 : 3)) {
        y = text(ctx, "• " + line, W - 80, y, { size: tall ? 34 : 31, weight: 600, maxW: W - 160, maxLines: 2 }) + (tall ? 64 : 54);
      }
    } else if (m.template === "race" || m.template === "compare") {
      const rows = d.rows || [];
      const rowH = square ? 118 : 160;
      for (const r of rows.slice(0, square ? 5 : 6)) {
        drawCrest(ctx, r.id, W - 80 - 80, y, 80);
        text(ctx, team(r.id).ar, W - 80 - 104, y + 44, { size: 38, weight: 800, display: true });
        if (r.sub) text(ctx, r.sub, W - 80 - 104, y + 86, { size: 26, weight: 600, color: "rgba(255,255,255,.7)", maxW: W - 400, maxLines: 1 });
        const bw = (W - 160 - 520) * Math.max(0.02, r.v || 0);
        roundRect(ctx, 80 + 160, y + 30, bw, 26, 13); ctx.fillStyle = r.color || m.accent; ctx.fill();
        ltrText(ctx, r.text, 80, y + 62, 54, "#fff", "left");
        y += rowH;
      }
      for (const line of (d.lines || []).slice(0, 2)) y = text(ctx, "• " + line, W - 80, y + 20, { size: 30, weight: 600, maxW: W - 160, maxLines: 2 }) + 56;
    } else if (m.template === "story") {
      y = text(ctx, d.text || "", W - 80, y, { size: tall ? 40 : 36, weight: 600, maxW: W - 160, maxLines: tall ? 9 : square ? 4 : 6, lh: 1.45 }) + 90;
      for (const ev of (d.evidence || []).slice(0, square ? 2 : 4)) {
        roundRect(ctx, 80, y - 54, W - 160, 88, 18); ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.fill();
        text(ctx, ev.label_ar, W - 110, y, { size: 30, weight: 700, color: "rgba(255,255,255,.8)", maxW: W - 460, maxLines: 1 });
        text(ctx, String(ev.value), 110, y, { size: 38, weight: 800, display: true, color: m.accent.startsWith("#") && m.accent !== "#e8eee9" ? m.accent : "#f3c14f", align: "left" });
        y += 110;
      }
    }
    return y;
  }

  function latinTime(iso) {
    const d = new Date(iso);
    const f = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Baghdad", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
    return `updated ${f.replace(",", "")} Baghdad`;
  }

  // ------------------------------------------------------------------ data for each template
  async function buildModel(st) {
    const meta = D.meta;
    const base = {
      template: st.template, format: st.format, accent: st.accent, handle: st.handle,
      label: TEMPLATES.find((t) => t[0] === st.template)[1],
      version: `${meta.versions.prematch_market} · data ${meta.versions.data}`,
      updated: latinTime(meta.generated_utc), source: "حاسوب زهراء الكروي (موديل ديكسون-كولز)، نتائج football-data وopenfootball",
    };
    const auto = { title: "", subtitle: "", data: {} };
    if (["prediction", "ht", "ft"].includes(st.template)) {
      const mf = st.match ? await ZS.matchFile(st.match) : null;
      if (!mf) return { ...base, ...auto, title: "اختاري مباراة" };
      const H = team(mf.home), A = team(mf.away);
      const t = mf.tracks[mf.displayed_track] || mf.tracks.market || Object.values(mf.tracks)[0];
      const live = mf.live;
      auto.data = { home: mf.home, away: mf.away };
      if (st.template === "prediction") {
        auto.title = `${H.ar} × ${A.ar}`;
        auto.subtitle = mf.takeaway_ar || "";
        auto.data.time = mf.kickoff_utc ? ZS.timeHM(mf.kickoff_utc) : "";
        auto.data.dateText = mf.kickoff_utc ? `${ZS.dateLong(mf.kickoff_utc)} · بتوقيت بغداد` : "";
        auto.data.p = t && t.p;
        const lines = [];
        if (t && t.top_scores) lines.push(`أرجح نتيجة: ${H.ar} ${t.top_scores[0][0].split("-")[0]} – ${t.top_scores[0][0].split("-")[1]} ${A.ar} (${pct(t.top_scores[0][1])})`);
        if (t && t.reasons && t.reasons[0]) lines.push(t.reasons[0].text_ar);
        const sw = mf.importance && mf.importance.swings && mf.importance.swings[0];
        if (sw) lines.push(`فرصة ${team(sw.team_id).ar} ب${{ p_title: "اللقب", p_ucl: "الأبطال", p_releg: "الهبوط" }[sw.metric]}: ${pct(sw.home_win)} إذا فاز ${H.ar}، ${pct(sw.away_win)} إذا فاز ${A.ar}`);
        auto.data.lines = lines;
        // context for the script: table position and recent form of both teams, pre-match expected goals
        try {
          const [s, ch, ca] = await Promise.all([ZS.getJSON("season.json"), ZS.getJSON(`teams/${mf.home}.json`), ZS.getJSON(`teams/${mf.away}.json`)]);
          const row = (id) => s.table.find((r) => r.id === id) || {};
          const form = (c) => { const f = (c.form || []).slice(-5); const w = f.filter((g) => g.result === "W").length, dr = f.filter((g) => g.result === "D").length; return { pts: f.reduce((a, g) => a + g.pts, 0), n: f.length, w, d: dr, l: f.length - w - dr }; };
          auto.data.ctx = { posH: row(mf.home).pos, ptsH: row(mf.home).Pts, posA: row(mf.away).pos, ptsA: row(mf.away).Pts, formH: form(ch), formA: form(ca), xg: t && t.xg, sr: mf.p_sr };
        } catch (e) { auto.data.ctx = null; }
        base.source = "حاسوب زهراء الكروي: توقع ما قبل المباراة";
        if (t && t.model_version) base.version = `${t.model_version} · data ${t.data_version}`;
      } else {
        const rep = live && live.reports && (st.template === "ht" ? live.reports.HT : live.reports.FT);
        const score = st.template === "ft" ? (mf.score || (live && live.score)) : (rep ? rep.now && live.reports.HT ? [rep.score ? rep.score[0] : (mf.ht || [0, 0])[0], rep.score ? rep.score[1] : (mf.ht || [0, 0])[1]] : mf.ht : mf.ht);
        auto.title = st.template === "ht" ? "نص الوقت" : "صافرة النهاية";
        auto.subtitle = `${H.ar} × ${A.ar}`;
        auto.data.score = score || null;
        auto.data.scoreNote = st.template === "ht" ? "نهاية الشوط الأول" : "النتيجة النهائية";
        if (rep && rep.now && st.template === "ht") auto.data.p = rep.now.p;
        const lines = [];
        if (rep) {
          for (const side of ["home", "away"]) { const ins = rep.insights && rep.insights[side]; if (ins && ins.pos && ins.pos[0]) lines.push(`${side === "home" ? H.ar : A.ar}: ${ins.pos[0]}`); }
          for (const n of rep.notes || []) lines.push(n);
          base.source = "SportRadar (إحصائيات وأحداث) + موديل الحاسوب المباشر";
        } else if (mf.facts) {
          if (mf.facts.sot) lines.push(`التسديدات على المرمى: ${H.ar} ${mf.facts.sot[0]} – ${mf.facts.sot[1]} ${A.ar}`);
          const tr = mf.tracks[mf.displayed_track];
          if (tr && tr.p) lines.push(`الحاسوب كان يعطي ${H.ar} ${pct(tr.p[0])} والتعادل ${pct(tr.p[1])} و${A.ar} ${pct(tr.p[2])}`);
        }
        auto.data.lines = lines;
      }
    } else if (st.template === "race") {
      const s = await ZS.getJSON("season.json");
      const sorted = s.projection.slice().sort((a, b) => b.p_title - a.p_title);
      const rows = sorted.filter((r, i) => i < 3 || r.p_title >= 0.005).slice(0, 5);
      auto.title = "سباق اللقب بالأرقام";
      auto.subtitle = `فرص اللقب من ${num(s.n_sims, 0)} موسم محاكى`;
      auto.data.rows = rows.map((r) => ({ id: r.id, v: r.p_title, text: pct(r.p_title), sub: `${r.pts_now} نقطة الآن · المتوقع ${num(r.exp_pts, 0)}`, color: "#f3c14f" }));
      base.source = "حاسوب زهراء الكروي: محاكاة الموسم";
      base.version = `${D.meta.versions.season} · data ${D.meta.versions.data}`;
    } else if (st.template === "compare") {
      const s = await ZS.getJSON("season.json");
      const ids = [st.teamA || "BAR", st.teamB || "RMA"];
      const pr = Object.fromEntries(s.projection.map((r) => [r.id, r]));
      const cards = await Promise.all(ids.map((id) => ZS.getJSON(`teams/${id}.json`)));
      auto.title = `${team(ids[0]).ar} × ${team(ids[1]).ar}`;
      auto.subtitle = "مقارنة بالأرقام";
      const rows = [];
      ids.forEach((id, k) => {
        const c = cards[k], r = pr[id] || {};
        rows.push({ id, v: (r.exp_pts || 0) / 100, text: num(r.exp_pts, 0), sub: `نقاط متوقعة · الآن ${r.pts_now} · هجوم ${num(c.ratings.market.attack, 2)}× · دفاع ${num(c.ratings.market.defence, 2)}×`, color: team(id).color });
      });
      auto.data.rows = rows;
      auto.data.lines = ids.map((id, k) => `${team(id).ar}: اللقب ${pct((pr[id] || {}).p_title)} · الأبطال ${pct((pr[id] || {}).p_ucl)} · نقاط ${cards[k].totals.pts} مقابل متوقع ${num(cards[k].totals.xpts_pre, 1)}`);
      base.source = "حاسوب زهراء الكروي";
    } else if (st.template === "story") {
      const story = st.story;
      if (!story) return { ...base, ...auto, title: "اختاري قصة" };
      auto.title = story.title_ar;
      auto.data.text = story.text_ar;
      auto.data.evidence = story.evidence || [];
      base.source = `حاسوب زهراء الكروي · ${story.comparison_ar || ""}`;
    }
    return { ...base, ...auto, title: st.title ?? auto.title, subtitle: st.subtitle ?? auto.subtitle };
  }

  // ------------------------------------------------------------------ script draft (Iraqi Arabic, 60-90 s)
  function scriptFor(model, mfLike) {
    const d = model.data || {};
    const parts = [];
    if (model.template === "prediction" && d.home) {
      const H = team(d.home).ar, A = team(d.away).ar;
      const p = d.p || [0.33, 0.33, 0.33];
      const best = p.indexOf(Math.max(...p));
      const fav = best === 0 ? H : A;
      parts.push(["الهوك", best === 1 ? `${H} ضد ${A}… مباراة ما بيها مرشح واضح، والحاسوب نفسه محتار!`
        : p[best] >= 0.6 ? `${H} ضد ${A}… الحاسوب حسمها قبل لا تبدي؟` : `${H} ضد ${A}… ${fav} مرشح، بس الحاسوب يگول: مو مضمونة!`]);
      parts.push(["الفكرة", `حاسوب زهراء يعطي ${H} ${pct(p[0])} للفوز، والتعادل ${pct(p[1])}، و${A} ${pct(p[2])}. ${model.subtitle || ""}`]);
      const c = d.ctx;
      if (c) {
        const fl = (f) => [f.w ? ZS.countAr(f.w, "فوز وحيد", "فوزين", "انتصارات", "فوز") : "بدون فوز",
          f.d ? ZS.countAr(f.d, "تعادل وحيد", "تعادلين", "تعادلات", "تعادل") : "",
          f.l ? ZS.countAr(f.l, "خسارة وحدة", "خسارتين", "خسارات", "خسارة") : "بدون خسارة"].filter(Boolean).join("، ");
        parts.push(["الوضع", `${H} بالمركز ${c.posH} برصيد ${c.ptsH} نقطة، و${A} بالمركز ${c.posA} برصيد ${c.ptsA}. آخر ${c.formH.n} مباريات: ${H} ${fl(c.formH)}، و${A} ${fl(c.formA)}.`]);
      }
      parts.push(["الأرقام", (d.lines || []).join(". ") + "." + (c && c.xg ? ` والأهداف المتوقعة قبل المباراة: ${H} ${c.xg[0].toFixed(1)} مقابل ${c.xg[1].toFixed(1)} لـ${A}.` : "")
        + (c && c.sr ? ` وللمقارنة، SportRadar يعطي ${H} ${pct(c.sr[0])}.` : "")]);
      parts.push(["ليش؟", "هالأرقام مو إحساس: الموديل يحسب قوة هجوم ودفاع كل فريق من نتائجه، وميزة الأرض، وهو مجرّب على أكثر من ألف مباراة ما شافها قبل."]);
      parts.push(["الختام", `وإنتو؟ تتفقون ويا الحاسوب لو عندكم مفاجأة؟ اكتبوا توقعكم بالأرقام بالتعليقات، ونشوف منو يطلع أشطر: الجمهور لو الحاسوب!`]);
    } else if ((model.template === "ht" || model.template === "ft") && d.home) {
      const H = team(d.home).ar, A = team(d.away).ar;
      const sc = d.score ? `${H} ${d.score[0]} و${A} ${d.score[1]}` : "";
      parts.push(["الهوك", model.template === "ht" ? `نص الوقت وصار عدنا قصة: ${sc}!` : `خلصت! ${sc}، وهاي القصة بالأرقام.`]);
      if (d.p) parts.push(["الفكرة", `حسب الحاسوب هسه: ${H} ${pct(d.p[0])}، تعادل ${pct(d.p[1])}، ${A} ${pct(d.p[2])}.`]);
      parts.push(["الأرقام", (d.lines || []).join(". ") + "."]);
      parts.push(["الختام", model.template === "ht" ? "الشوط الثاني راح يقلبها لو تبقى؟ اكتبوا توقعكم قبل لا تنتهي!" : "النتيجة عادلة لو ظالمة حسب رأيكم؟ ناقشوني بالتعليقات."]);
    } else if (model.template === "race") {
      const r = d.rows || [];
      parts.push(["الهوك", "منو ياخذ الليغا هالموسم؟ الحاسوب لعب الموسم عشرة آلاف مرة!"]);
      parts.push(["الفكرة", r.map((x) => `${team(x.id).ar} ${x.text}`).join("، ") + "."]);
      parts.push(["الأرقام", r.slice(0, 2).map((x) => `${team(x.id).ar}: ${x.sub}`).join(". ") + "."]);
      parts.push(["الختام", "الأرقام تگول شي، والملعب يگول شي ثاني… منو مرشحكم؟ اكتبوه بالتعليقات."]);
    } else if (model.template === "compare") {
      parts.push(["الهوك", `${model.title}: منو أقوى فعلاً بالأرقام؟`]);
      parts.push(["الأرقام", (d.lines || []).join(". ") + "."]);
      parts.push(["الختام", "إنتو مع منو؟ وليش؟ أريد أسبابكم مو بس الاسم!"]);
    } else if (model.template === "story") {
      parts.push(["الهوك", model.title]);
      parts.push(["الفكرة", d.text || ""]);
      parts.push(["الأرقام", (d.evidence || []).map((e) => `${e.label_ar}: ${e.value}`).join("، ") + "."]);
      parts.push(["الختام", "هل هي صدفة لو شي حقيقي راح يكمل؟ ناقشوني بالتعليقات."]);
    }
    return parts.map(([k, v]) => `[${k}]\n${v.trim()}`).join("\n\n");
  }
  function wordStats(t) {
    const words = t.replace(/\[[^\]]+\]/g, "").split(/\s+/).filter(Boolean).length;
    return { words, seconds: Math.round(words / 2.3) };
  }

  // ------------------------------------------------------------------ Matches (home)
  const dayLabel = (key, today) => {

  };
  const addDays = (key, n) => new Date(Date.parse(key + "T12:00:00Z") + n * 864e5).toISOString().slice(0, 10);

  async function renderMatches(view, params) {
    if (params.id && /^md\d+$/.test(params.id) && oldMatches) return oldMatches.render(view, params);

    const byDay = new Map();

      for (let i = 0; i < 14; i++) { const k = addDays(today, i); if (byDay.has(k)) return k; }

    function drawStrip() {

          onclick: () => { day = k; calInput.value = k; drawStrip(); draw(); history.replaceState(null, "", ZS.href("matches", k)); },
        }, h("span.dchip-d", dayLabel(k, today)), h("span.dchip-n.num", `${d.getUTCDate()}/${d.getUTCMonth() + 1}`), n ? h("i.dchip-dot") : null);
        strip.appendChild(b);

        chips.appendChild(h("button.chip", { type: "button", "aria-pressed": String(filter === k), onclick: () => { filter = filter === k ? "all" : k; draw(); } }, lab));
      }

      if (query) {

          .sort((a, b) => a.kickoff_utc.localeCompare(b.kickoff_utc)).filter((f) => ZS.dayKey(f.kickoff_utc) >= addDays(today, -7)).slice(0, 40);

          !query && next !== day ? h("button.btn.ghost", { type: "button", onclick: () => { day = next; calInput.value = next; drawStrip(); draw(); } }, `روحي لأقرب يوم بيه مباريات (${dayLabel(next, today)})`) : null));

  // ------------------------------------------------------------------ stories for News (from the computer's numbers)
  async function buildStories() {
    const out = [];
    try {
      const st = await ZS.getJSON("stories.json");
      for (const s of st.stories || []) {
        const mids = s.matches || [];
        const f = mids.length ? D.fixturesById.get(mids[0]) : null;
        out.push({ id: s.id, comp: "ESP1", kind: kindAr(s.type), title: s.title_ar, text: s.text_ar,
          teams: f ? [f.home, f.away] : (s.teams || []), stat: (s.evidence || [])[0] || null,
          href: f ? ZS.href("match", f.match_id) : ZS.href("season"), studio: ZS.href("studio", "story-" + s.id), score: s.score || 1 });
      }
    } catch (e) { /* no La Liga stories */ }
    for (const cid of ["ENG1", "UCL"]) {
      if (!D.xfixtures || !D.xfixtures[cid]) continue;
      let ss;
      try { ss = await compSeason(cid); } catch (e) { continue; }
      const c = comp(cid);
      const fx = D.xfixtures[cid];
      const T = (id) => team(id).ar;
      if (cid === "ENG1") {
        const pr = ss.projection.slice().sort((a, b) => b.p_title - a.p_title);
        const [a, b, c3] = pr;
        out.push({ id: "eng-title", comp: cid, kind: "سباق اللقب", title: `البريميرليغ: ${T(a.team)} ${pct(a.p_title)} و${T(b.team)} ${pct(b.p_title)}`,
          text: `بعد ${ss.table[0].P} جولات، ${T(a.team)} عنده ${a.pts_now} نقطة ومتوقع يخلص بحدود ${Math.round(a.exp_pts)}. ${T(c3.team)} الثالث بحظوظ ${pct(c3.p_title)}.`,
          teams: [a.team, b.team, c3.team], stat: { label_ar: "حظوظ اللقب", value: pct(a.p_title) }, href: ZS.href("comp", cid), score: 3 });
        const rel = ss.projection.slice().sort((x, y) => y.p_releg - x.p_releg).slice(0, 3);
        out.push({ id: "eng-releg", comp: cid, kind: "معركة البقاء", title: `خطر الهبوط: ${rel.map((r) => `${T(r.team)} ${pct(r.p_releg)}`).join("، ")}`,
          text: `أكثر ثلاث فرق مهددة بالهبوط حسب ${ss.n_sims.toLocaleString("en")} محاكاة لبقية الموسم.`, teams: rel.map((r) => r.team),
          stat: { label_ar: "احتمال الهبوط", value: pct(rel[0].p_releg) }, href: ZS.href("standings", cid), score: 2.2 });
      } else {
        const pr = ss.projection.slice().sort((a, b) => b.p_win - a.p_win);
        out.push({ id: "ucl-win", comp: cid, kind: "مين ياخذ الأبطال؟", title: `المرشحين للقب: ${pr.slice(0, 3).map((r) => `${T(r.team)} ${pct(r.p_win)}`).join("، ")}`,
          text: `محاكاة كاملة لمرحلة الدوري والأدوار الإقصائية (${ss.n_sims.toLocaleString("en")} مرة) بتقييم Elo يتحدث بكل نتيجة.`,
          teams: pr.slice(0, 3).map((r) => r.team), stat: { label_ar: "حظوظ اللقب", value: pct(pr[0].p_win) }, href: ZS.href("comp", cid), score: 3.2 });
        const risk = ss.projection.filter((r) => r.elo >= 1800 && r.p_out >= 0.08).sort((a, b) => b.p_out - a.p_out).slice(0, 3);
        if (risk.length) out.push({ id: "ucl-risk", comp: cid, kind: "كبار بخطر", title: `فرق كبيرة مهددة بالخروج: ${risk.map((r) => `${T(r.team)} ${pct(r.p_out)}`).join("، ")}`,
          text: "احتمال إنهاء مرحلة الدوري بالمركز 25 أو أقل (خروج مباشر).", teams: risk.map((r) => r.team),
          stat: { label_ar: "احتمال الخروج", value: pct(risk[0].p_out) }, href: ZS.href("standings", cid), score: 2.4 });
      }
      // biggest surprise of the last 10 days and the biggest match of the next 10 days
      const now = Date.now();
      const recent = fx.filter((f) => f.score && f.p && now - Date.parse(f.kickoff_utc) < 10 * 864e5);
      if (recent.length) {
        const sur = recent.map((f) => { const o = f.score[0] > f.score[1] ? 0 : f.score[0] < f.score[1] ? 2 : 1; return { f, o, q: f.p[o] }; }).sort((a, b) => a.q - b.q)[0];
        const f = sur.f;
        const what = sur.o === 1 ? `تعادل ${T(f.home)} و${T(f.away)}` : `${T(sur.o === 0 ? f.home : f.away)} فاز على ${T(sur.o === 0 ? f.away : f.home)}`;
        out.push({ id: cid + "-surprise", comp: cid, kind: "مفاجأة", title: `${what} ${ZS.scoreText(f.score[0], f.score[1])}`,
          text: `احتمال هالنتيجة قبل المباراة كان ${pct(sur.q)} بس (توقع بأثر رجعي بنفس الموديل).`, teams: [f.home, f.away],
          stat: { label_ar: "احتمالها قبل المباراة", value: pct(sur.q) }, href: matchHref(f), score: 2.6 - sur.q });
      }
      const soon = fx.filter((f) => !f.score && f.kickoff_utc && Date.parse(f.kickoff_utc) > now && Date.parse(f.kickoff_utc) - now < 12 * 864e5);
      if (soon.length) {
        const strength = (id) => { const r = ss.projection.find((x) => x.team === id); return r ? (r.elo || r.exp_pts * 30) : 0; };
        const big = soon.slice().sort((a, b) => Math.min(strength(b.home), strength(b.away)) - Math.min(strength(a.home), strength(a.away)))[0];
        out.push({ id: cid + "-big", comp: cid, kind: "قمة قادمة", title: `${T(big.home)} × ${T(big.away)}`,
          text: `${big.takeaway_ar}. النتيجة الأرجح ${big.top_score}.`, teams: [big.home, big.away],
          stat: { label_ar: ZS.dateShort(big.kickoff_utc), value: ZS.timeHM(big.kickoff_utc) }, href: matchHref(big), score: 2.5 });
      }
    }
    const p = ZS.store.prefs();
    for (const s of out) if ((s.teams || []).some((t) => p.fav_teams.includes(t))) s.score += 2;
    return out.sort((a, b) => b.score - a.score);
  }

  async function renderComps(view, params) {

    const body = h("div.stack-lg");
    view.appendChild(body);
    function draw() {
      ZS.clear(body);
      const p = ZS.store.prefs();
      const order = compOrder({ withHidden: true });
      const fav = order.filter((c) => (p.fav_comps || []).includes(c) && !(p.comp_hidden || []).includes(c));
      const rest = order.filter((c) => !(p.fav_comps || []).includes(c) && !(p.comp_hidden || []).includes(c));
      const hidden = order.filter((c) => (p.comp_hidden || []).includes(c));
      const row = (cid, i, arr) => {
        const c = comp(cid);
        const isFav = (p.fav_comps || []).includes(cid), isHidden = (p.comp_hidden || []).includes(cid);
        const n = cid === "ESP1" ? D.fixtures.length : (D.xfixtures[cid] || []).length;

          h("div.comp-tools",

            h("button.icon-btn.sm", { type: "button", "aria-label": `${c.short_ar} لجوة`, disabled: i === arr.length - 1, onclick: () => move(cid, 1, arr) }, ui().icon("down")),
            h("button.icon-btn.sm" + (isHidden ? ".on" : ""), { type: "button", "aria-pressed": String(isHidden), "aria-label": isHidden ? `أظهري ${c.short_ar}` : `أخفي ${c.short_ar}`, onclick: () => toggle("comp_hidden", cid) }, ui().icon(isHidden ? "eyeoff" : "eye")),
            h("button.star-btn" + (isFav ? ".on" : ""), { type: "button", "aria-pressed": String(isFav), "aria-label": isFav ? `شيلي ${c.short_ar} من المفضلة` : `ضيفي ${c.short_ar} للمفضلة`, onclick: () => toggle("fav_comps", cid) }, ui().icon("star"))));
      };
      if (fav.length) body.appendChild(ui().section("المفضلة", h("div.comp-list", fav.map((c, i, a) => row(c, i, a)))));
      if (rest.length) body.appendChild(ui().section("كل البطولات", h("div.comp-list", rest.map((c, i, a) => row(c, i, a)))));
      if (hidden.length) body.appendChild(ui().section("المخفية", h("div.comp-list", hidden.map((c, i, a) => row(c, i, a)))));
      body.appendChild(h("p.hub-note", ui().icon("info"), h("span", "بطولات ثانية (الدوري الألماني، الإيطالي…) ممكن تنضاف بنفس الطريقة المجانية؛ شوفي اقتراح النسخة القادمة بصفحة البيانات.")));
    }
    async function toggle(key, cid) {
      const p = ZS.store.prefs();
      const set = new Set(p[key] || []);
      set.has(cid) ? set.delete(cid) : set.add(cid);
      await ZS.store.setPrefs({ [key]: [...set] });
      draw();
    }
    async function move(cid, dir, arr) {
      const i = arr.indexOf(cid), j = i + dir;
      if (j < 0 || j >= arr.length) return;
      const swap = arr[j];
      const order = compOrder({ withHidden: true }).slice();
      const a = order.indexOf(cid), b = order.indexOf(swap);
      [order[a], order[b]] = [order[b], order[a]];
      await ZS.store.setPrefs({ comp_order: order });
      draw();
    }
    draw();
  }

        h("div.reason", h("span", `تقييم Elo: ${H.ar} ${Math.round(f.elo[0])} مقابل ${A.ar} ${Math.round(f.elo[1])}`), h("strong.num", (gap >= 0 ? "+" : "") + Math.round(gap))),
        h("div.reason", h("span", "ميزة الأرض بدوري الأبطال (عامة)"), h("strong.num", `+${Math.round((ss.elo && ss.elo.hfa_elo) || 65)} Elo`)),
        h("p.small.muted", `كل 100 نقطة Elo فرق ≈ ${((Math.exp((ss.goal_model.b_home) * 0.25) - 1) * 100).toFixed(0)}% أهداف أكثر للأقوى حسب موديل الأهداف.`));
      const ph = ss.projection.find((r) => r.team === f.home), pa = ss.projection.find((r) => r.team === f.away);
      if (ph && pa) why.appendChild(h("p.small", `حظوظ أول 8: ${H.ar} ${pct(ph.p_top8)} · ${A.ar} ${pct(pa.p_top8)}`));
    } else if (ss.ratings) {
      const rh = ss.ratings.find((r) => r.team === f.home), ra = ss.ratings.find((r) => r.team === f.away);
      const line = (t, r) => r ? h("div.reason", h("span", `${t.ar}: هجوم ×${r.attack} من المعدل، دفاع ×${r.defence} (أقل = أحسن)`)) : null;
      why.append(line(H, rh), line(A, ra), h("div.reason", h("span", "ميزة الأرض بالبريميرليغ (عامة)"), h("strong.num", `×${ss.home_adv_x}`)));
      const ph = ss.projection.find((r) => r.team === f.home), pa = ss.projection.find((r) => r.team === f.away);
      if (ph && pa) why.appendChild(h("p.small", `متوقع بنهاية الموسم: ${H.ar} ${Math.round(ph.exp_pts)} نقطة · ${A.ar} ${Math.round(pa.exp_pts)} نقطة`));
    }
    view.appendChild(ui().section("ليش هالتوقع؟", why));
    if (cid === "ENG1" && (D.freeFiles || []).includes("fpl_availability.json")) {
      try {
        const av = await ZS.getJSON("free/fpl_availability.json");
        const fplCode = { CFC: "CHE", LFC: "LIV", MCI: "MCI", MUN: "MUN", NFO: "NFO", BRI: "BHA", HUL: "HUL", COV: "COV", IPS: "IPS", SUN: "SUN", LEE: "LEE" };
        const code = (id) => fplCode[id] || id;
        const rows = av.players.filter((x) => [code(f.home), code(f.away)].includes(x.team));
        view.appendChild(ui().section("الغيابات (Fantasy Premier League)", rows.length
          ? h("div.stack", rows.map((x) => h("div.reason", h("span", `${x.team === code(f.home) ? H.ar : A.ar}: ${x.player} · ${x.status_ar}${x.chance_next !== null && x.chance_next !== undefined ? " · فرصة اللعب " + x.chance_next + "%" : ""}`), h("small.muted", x.news))), h("span.small.muted", `آخر جلب ${ZS.ago(av.fetched_utc)}`))
          : h("p.small", "ماكو غيابات مسجلة للفريقين بآخر جلب")));
      } catch (e) { /* FPL file not fetched in this build */ }
    }
    view.appendChild(h("p.hub-note", ui().icon("info"), h("span", cid === "ENG1"
      ? "مركز المباراة الكامل (التشكيلات، الخط الزمني، التحليل المباشر) لحد هسه بالليغا بس؛ البريميرليغ ودوري الأبطال بالنسخة القادمة."
      : "دوري الأبطال بهالنسخة: توقع قبل المباراة + محاكاة البطولة. التحليل المباشر بالنسخة القادمة.")));
  }

  // ------------------------------------------------------------------ any team (Premier League / Champions League / La Liga in Europe)
  async function renderXTeam(view, params) {
    const id = params.id;
    const t = team(id);
    view.appendChild(h("div.comp-hero", { style: { "--cc": t.color } }, ui().crest(id, "xl"),
      h("div", h("p.eyebrow", t.en || ""), h("h1.hub-title", t.ar), D.teams.teams[id] ? h("a.small", { href: ZS.href("team", id) }, "صفحة الفريق الكاملة بالليغا ←") : null)));
    const p = ZS.store.prefs();
    const isFav = p.fav_teams.includes(id);
    view.appendChild(h("div.row", h("button.btn" + (isFav ? ".ghost" : ""), { type: "button", onclick: async () => {
      const s = new Set(ZS.store.prefs().fav_teams); s.has(id) ? s.delete(id) : s.add(id);
      await ZS.store.setPrefs({ fav_teams: [...s] }); ZS.render();
    } }, ui().icon("star"), isFav ? "مفضل ✓" : "ضيفيه للمفضلة")));
    const fx = allFixtures().filter((f) => f.home === id || f.away === id).sort((a, b) => (a.kickoff_utc || "").localeCompare(b.kickoff_utc || ""));
    const comps = [...new Set(fx.map(fixtureComp))];
    for (const cid of comps) {
      try {
        const ss = await compSeason(cid);
        const r = ss.projection.find((x) => (x.id || (cid === "ESP1" ? D.keyToId[x.team] : x.team)) === id);
        if (!r) continue;
        const kp = (lab, val) => h("div.kpi", h("span.kpi-lab", lab), h("strong.kpi-val.num", val));
        const k = cid === "UCL" ? [kp("أول 8", pct(r.p_top8)), kp("الخروج", pct(r.p_out)), kp("اللقب", pct(r.p_win)), kp("Elo", Math.round(r.elo))]
          : [kp("نقاط متوقعة", Math.round(r.exp_pts)), kp("اللقب", pct(r.p_title)), kp(cid === "ENG1" ? "أول 4" : "الأبطال", pct(cid === "ENG1" ? r.p_top4 : r.p_ucl)), kp("الهبوط", pct(r.p_releg))];
        view.appendChild(ui().section(comp(cid).name_ar, h("div.kpis", k), h("a.small", { href: ZS.href("comp", cid) }, "البطولة ←")));
      } catch (e) { /* skip */ }
    }
    const now = Date.now();
    const next = fx.filter((f) => !f.score && f.kickoff_utc && Date.parse(f.kickoff_utc) > now - 3 * 3600e3).slice(0, 6);
    const last = fx.filter((f) => f.score).slice(-6).reverse();
    if (next.length) view.appendChild(ui().section("الجاية", h("div.cgroup-rows", next.map((f) => matchRow(f, { showComp: true, showDate: true })))));
    if (last.length) view.appendChild(ui().section("آخر النتائج", h("div.cgroup-rows", last.map((f) => matchRow(f, { showComp: true, showDate: true })))));
  }

  // ------------------------------------------------------------------ More
  async function renderMore(view) {
    const p = ZS.store.prefs();
    let name = "";
    try { if (ZS.env.user && ZS.env.user.me) { const me = await ZS.env.user.me(); name = (me && me.name) || ""; } } catch (e) { /* ignore */ }
    const mode = { server: "خادم محلي", artifact: "رابط Claude", local: "معاينة بالمتصفح" }[ZS.env.mode] || "";
    view.appendChild(h("div.profile",
      h("span.avatar", { "aria-hidden": "true" }, (name || "ز").trim().charAt(0)),
      h("div", h("strong", name || "حاسوب زهراء الكروي"), h("small", { dir: "ltr" }, "@zahraatalksfootball94"), h("small", `${mode} · آخر تحديث ${ZS.ago(D.meta.generated_utc)}`))));
    const pills = [["studio", "الاستوديو", "studio"], ["challenge", "تحدي الجمهور", "challenge"], ["players", "اللاعبين", "teams"], ["archive", "الأرشيف العميق", "matches"], ["today", "ملخص اليوم", "today"], ["teams", "فرق الليغا", "teams"], ["season", "موسم الليغا", "season"], ["alerts", "التنبيهات", "bell"]];
    view.appendChild(h("div.pill-grid", pills.map(([k, lab, ic]) => h("a.pill-link", { href: ZS.href(k) }, ui().icon(ic), h("span", lab)))));
    const themeAr = { dark: "ليلي", light: "نهاري", system: "حسب الجهاز" }[p.theme || "dark"];
    const fsAr = { s: "صغير", m: "متوسط", l: "كبير" }[p.font_size || "m"];
    const row = (ic, lab, val, on) => h(on.href ? "a.set-row" : "button.set-row", on.href ? { href: on.href } : { type: "button", onclick: on.click },
      h("span.set-ico", ui().icon(ic)), h("span.set-lab", lab), val ? h("span.set-val", val) : null, h("span.set-chev", ui().icon("chevron")));
    const cycle = async (key, vals) => { const cur = ZS.store.prefs()[key]; const nx = vals[(vals.indexOf(cur) + 1) % vals.length]; await ZS.store.setPrefs({ [key]: nx }); ZS.applyTheme(); ZS.render(); };
    view.appendChild(h("div.set-list", { role: "list" },
      row("globe", "اللغة", "العربية", { click: () => ZS.toast("الواجهة عربية حالياً؛ الإنجليزية مقترحة للنسخة القادمة") }),
      row("moon", "المظهر", themeAr, { click: () => cycle("theme", ["dark", "light", "system"]) }),
      row("text", "حجم الخط", fsAr, { click: () => cycle("font_size", ["s", "m", "l"]) }),
      row("clock", "توقيت المباريات", `بغداد · ${p.clock === "12" ? "12 ساعة" : "24 ساعة"}`, { click: () => cycle("clock", ["24", "12"]) }),
      row("bell", "التنبيهات", "", { href: ZS.href("alerts") }),
      row("comps", "ترتيب البطولات وإخفاؤها", "", { href: ZS.href("comps") }),
      row("method", "المنهجية والدقة", "", { href: ZS.href("method") }),
      row("data", "البيانات والمصادر المجانية", "", { href: ZS.href("data") }),
      row("settings", "إعدادات أكثر (الفرق المفضلة، بياناتي)", "", { href: ZS.href("prefs") })));
    view.appendChild(h("p.hub-note", ui().icon("info"), h("span", `النسخة 3.0 · ${D.meta.platform ? D.meta.platform.name : ""}`)));
  }

  Object.assign(ZS.routes, {
    matches: { render: renderMatches, title: "المباريات", currentMatchday: oldMatches && oldMatches.currentMatchday },
    news: { render: renderNews, title: "الأخبار" },
    comps: { render: renderComps, title: "البطولات" },
    comp: { render: (v, p) => renderComp(v, p.id || "ESP1"), title: "البطولة" },
    standings: { render: renderStandings, title: "الترتيب" },
    more: { render: renderMore, title: "المزيد" },
    xmatch: { render: renderXMatch, title: "المباراة" },
    xteam: { render: renderXTeam, title: "الفريق" },
  });
})();

/* ---- js/main.js ---- */
/* main.js: start-up, navigation, theme, data status, alerts. */
(function () {
  "use strict";
  const ZS = window.ZS;
  const { h, $, D } = ZS;
  const ui = () => ZS.ui;

  const NAV = [["matches", "المباريات"], ["news", "الأخبار"], ["comps", "البطولات"], ["standings", "الترتيب"], ["more", "المزيد"]];
  const MORE = [["studio", "الاستوديو"], ["today", "ملخص اليوم (لاليغا)"], ["season", "موسم الليغا"], ["teams", "فرق الليغا"], ["method", "المنهجية والدقة"], ["data", "البيانات والمصادر"], ["challenge", "تحدي الجمهور"], ["archive", "أرشيف التحليل العميق"], ["players", "اللاعبين (أرشيف)"], ["prefs", "الإعدادات"]];
  const SECTION_OF = { match: "matches", xmatch: "matches", round: "matches", team: "comps", xteam: "comps", comp: "comps", archive: "more", challenge: "more", alerts: "more", players: "more", today: "more", season: "comps", teams: "comps", studio: "more", method: "more", data: "more", prefs: "more" };
  const NAV_ICON = { matches: "matches", news: "news", comps: "comps", standings: "standings", more: "more" };

  function applyTheme() {
    const p = ZS.store.prefs();
    const root = document.documentElement;
    if (p.theme === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", p.theme || "dark");
    root.classList.toggle("reduce-motion", !!p.reduce_motion);
    root.setAttribute("data-fs", p.font_size || "m");
  }
  ZS.applyTheme = applyTheme;

  function buildNav() {
    const main = $(".nav-main"), more = $(".nav-more"), bottom = $(".bottom-nav"), top = $("#topbar-actions");
    for (const [k, lab] of NAV) {
      if (k !== "more") main.appendChild(h("a.nav-item", { href: ZS.href(k), "data-nav": k }, ui().icon(NAV_ICON[k]), h("span", lab)));
      bottom.appendChild(h("a.nav-item", { href: ZS.href(k), "data-nav": k }, ui().icon(NAV_ICON[k]), h("span", lab)));
    }
    main.appendChild(h("a.nav-item", { href: ZS.href("more"), "data-nav": "more" }, ui().icon("more"), h("span", "المزيد")));
    for (const [k, lab] of MORE) more.appendChild(h("a.nav-item", { href: ZS.href(k), "data-nav": k }, ui().icon(k === "archive" ? "matches" : k === "prefs" ? "settings" : k === "players" ? "teams" : k), h("span", lab)));
    const bell = () => h("a.icon-btn.bell", { href: ZS.href("alerts"), "aria-label": "التنبيهات" }, ui().icon("bell"));
    more.prepend(h("a.nav-item", { href: ZS.href("alerts"), "data-nav": "alerts" }, ui().icon("bell"), h("span", "التنبيهات"), h("span.tag.led.alert-count", { hidden: true }, "")));
    top.append(bell(),
      h("a.icon-btn", { href: ZS.href("method"), "aria-label": "المنهجية والدقة" }, ui().icon("method")),
      h("button.icon-btn", { type: "button", "aria-label": "المزيد", onclick: moreSheet }, ui().icon("settings")));
  }
  function moreSheet() {
    ui().openSheet("المزيد", h("div.stack", MORE.map(([k, lab]) => h("a.nav-item", { href: ZS.href(k), onclick: () => ui().closeSheet() }, ui().icon(k === "archive" ? "matches" : k === "prefs" ? "settings" : k === "players" ? "teams" : k), h("span", lab))),
      h("hr.sep"), sideStatus(true)));
  }
  function markNav(r) {
    const key = SECTION_OF[r.page] || r.page;
    ZS.$$("[data-nav]").forEach((a) => {
      if (a.classList.contains("brand")) return;
      if (a.dataset.nav === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    const t = ZS.routes[r.page] && ZS.routes[r.page].title;
    document.title = (t ? t + " · " : "") + "حاسوب زهراء الكروي";
  }

  function sideStatus(inSheet) {
    const m = D.meta;
    const hours = (Date.now() - new Date(m.generated_utc).getTime()) / 3600e3;
    const ok = (m.data_status || {}).last_build_ok !== false;
    const dot = (col) => h("i", { style: { width: "9px", height: "9px", borderRadius: "50%", background: col, display: "inline-block", flex: "0 0 9px" } });
    const mode = { server: "خادم محلي", artifact: "رابط Claude", local: "معاينة بالمتصفح" }[ZS.env.mode];
    return h("div.stack", { style: { gap: "6px" } },
      h("div.status-line", dot(hours > 36 || !ok ? "var(--led)" : "var(--good)"), h("span", `آخر تحديث ${ZS.ago(m.generated_utc)}`)),
      h("div.status-line.tiny", `البيانات ${m.versions.data} · ${m.versions.prematch_market}`),
      h("div.status-line.tiny", `الوضع: ${mode}`),
      inSheet ? null : h("a.tiny", { href: ZS.href("data") }, "حالة البيانات والمصادر ←"));
  }
  function drawStatus() {
    const box = $("#side-status");
    ZS.clear(box).appendChild(sideStatus(false));
    const foot = $("#foot");
    ZS.clear(foot).append(
      h("span", `${D.meta.platform.name} ${D.meta.platform.version}`),
      h("span", `تحديث ${ZS.dateTime(D.meta.generated_utc)} بتوقيت بغداد`),
      h("span", "مصادر مجانية: openfootball · football-data.co.uk (عبر GitHub) · ClubElo (عبر xgabora) · SportRadar عبر Claude · StatsBomb Open Data"),
      h("a", { href: ZS.href("method") }, "كيف نقيس الدقة"));
  }
  function drawBanner() {
    const b = $("#banner");
    ZS.clear(b);
    const m = D.meta;
    const hours = (Date.now() - new Date(m.generated_utc).getTime()) / 3600e3;
    const ds = m.data_status || {};
    if (ds.last_build_ok === false) b.appendChild(h("div.notice.bad", ui().icon("warn"), h("span", "آخر تحديث للبيانات فشل؛ التطبيق يعرض آخر نسخة سليمة. التفاصيل بصفحة البيانات.")));
    else if (hours > 36) b.appendChild(h("div.notice.led", ui().icon("warn"), h("span", `البيانات عمرها ${Math.round(hours)} ساعة: النتائج الجديدة ممكن ما تكون داخلة بعد.`)));
  }
  function drawAlertDot() {
    const n = ZS.alerts ? ZS.alerts.compute().length : 0;
    ZS.$$(".bell").forEach((b) => { const d = b.querySelector(".dot"); if (n && !d) b.appendChild(h("span.dot")); if (!n && d) d.remove(); });
    ZS.$$(".alert-count").forEach((c) => { c.hidden = !n; c.textContent = String(n); });
  }

  async function boot() {
    document.documentElement.setAttribute("lang", "ar");
    document.documentElement.setAttribute("dir", "rtl");
    applyTheme();
    buildNav();
    ZS.on("route", (r) => { markNav(r); });
    ZS.on("prefs", () => { applyTheme(); drawAlertDot(); });
    ZS.on("alerts", drawAlertDot);
    await ZS.detectEnv();
    if (ZS.env.server) await ZS.store.syncFromServer();
    applyTheme();
    try {
      await ZS.loadCore();
    } catch (e) {
      const view = $("#view");
      ZS.clear(view).appendChild(ui().errorCard(e, () => location.reload()));
      return;
    }
    drawStatus();
    drawBanner();
    // first visit: remember what was seen so the next visit can show what changed
    if (!ZS.store.prefs().seen) await ZS.alerts.markSeen();
    drawAlertDot();
    await ZS.render();
    // a newer snapshot appears (server mode or a republished artifact): reload the data quietly
    setInterval(async () => {
      try {
        const m = await ZS.getJSON("meta.json", { fresh: true });
        if (m.generated_utc !== D.meta.generated_utc) {
          ZS.invalidate();
          await ZS.loadCore();
          drawStatus(); drawBanner(); drawAlertDot();
          ZS.toast("وصل تحديث جديد للبيانات");
          if (["today", "matches", "match", "season", "news", "standings", "comp"].includes(ZS.current().page)) ZS.render();
        }
      } catch (e) { /* offline: keep the last data */ }
      const fr = ZS.store.prefs().alerts.frequency;
      if (fr === "hourly") drawAlertDot();
    }, 5 * 60 * 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
