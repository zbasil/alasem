<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahraa Football Supercomputer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Zahraa Football Supercomputer: توقعات وتحليل لاليغا والبريميرليغ ودوري الأبطال">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Changa:wght@500;700;800&display=swap">
<style>
/* Zahraa Football Supercomputer: one stylesheet for the whole app.
   Layout: right-hand sidebar + one content column on desktop; top bar + bottom tab bar on phones.
   Look: floodlit scoreboard cards on a charcoal ground; pitch green marks the model, amber (the LED of a
   stadium scoreboard) marks live states and changes. Dark is the home theme; light is complete too. */

:root {
  --bg: #101412;
  --bg-elev: #151a17;
  --card: #1a201d;
  --card-2: #212824;
  --inset: #0c0f0d;
  --line: #2a332e;
  --line-strong: #3a4640;
  --fg: #e8eee9;
  --fg-2: #b0bdb4;
  --fg-3: #84928a;
  --pitch: #34b46c;
  --pitch-strong: #4fd389;
  --pitch-ink: #04170c;
  --pitch-soft: rgba(52, 180, 108, .14);
  --chalk: rgba(232, 238, 233, .14);
  --led: #f3c14f;
  --led-ink: #241a02;
  --led-soft: rgba(243, 193, 79, .14);
  --good: #45cf7b;
  --bad: #f06a5f;
  --bad-soft: rgba(240, 106, 95, .14);
  --live: #ff5b4f;
  --draw: #7d8a83;
  --title: #f3c14f;
  --ucl: #6f8fff;
  --uel: #f6a03a;
  --uecl: #34c3a3;
  --releg: #f06a5f;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px rgba(0, 0, 0, .28);
  --font-body: "Cairo Local", "Cairo", "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-display: "Changa Local", "Changa", "Cairo Local", "Cairo", "Segoe UI", Tahoma, sans-serif;
  --r-xs: 4px;
  --r-sm: 7px;
  --r: 11px;
  --r-lg: 16px;
  --side-w: 252px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --t-fast: .14s;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1ec; --bg-elev: #f6f8f4; --card: #ffffff; --card-2: #f4f7f2; --inset: #e7ece5;
    --line: #d6ded6; --line-strong: #bccabe; --fg: #111c16; --fg-2: #415248; --fg-3: #66766c;
    --pitch: #1d7f46; --pitch-strong: #156a39; --pitch-ink: #ffffff; --pitch-soft: rgba(29, 127, 70, .1);
    --chalk: rgba(17, 28, 22, .09); --led: #a8730a; --led-ink: #ffffff; --led-soft: rgba(168, 115, 10, .12);
    --good: #1d8a4a; --bad: #c63c32; --bad-soft: rgba(198, 60, 50, .1); --live: #d63a2f; --draw: #8a958e;
    --title: #b07a0b; --ucl: #3156d8; --uel: #c9700d; --uecl: #138a70; --releg: #c63c32;
    --shadow: 0 1px 2px rgba(17, 28, 22, .06), 0 8px 24px rgba(17, 28, 22, .07);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1ec; --bg-elev: #f6f8f4; --card: #ffffff; --card-2: #f4f7f2; --inset: #e7ece5;
  --line: #d6ded6; --line-strong: #bccabe; --fg: #111c16; --fg-2: #415248; --fg-3: #66766c;
  --pitch: #1d7f46; --pitch-strong: #156a39; --pitch-ink: #ffffff; --pitch-soft: rgba(29, 127, 70, .1);
  --chalk: rgba(17, 28, 22, .09); --led: #a8730a; --led-ink: #ffffff; --led-soft: rgba(168, 115, 10, .12);
  --good: #1d8a4a; --bad: #c63c32; --bad-soft: rgba(198, 60, 50, .1); --live: #d63a2f; --draw: #8a958e;
  --title: #b07a0b; --ucl: #3156d8; --uel: #c9700d; --uecl: #138a70; --releg: #c63c32;
  --shadow: 0 1px 2px rgba(17, 28, 22, .06), 0 8px 24px rgba(17, 28, 22, .07);
  color-scheme: light;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--bg-elev);
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.25; margin: 0; text-wrap: balance; font-weight: 700; }
h1 { font-size: clamp(1.45rem, 1.1rem + 1.2vw, 1.95rem); }
h2 { font-size: 1.18rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
a { color: var(--pitch-strong); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--led); outline-offset: 2px; border-radius: var(--r-xs); }
[hidden] { display: none !important; }
.num, .tab-num { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: .84rem; }
.tiny { font-size: .76rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nowrap { white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---------- app frame ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.sidebar {
  grid-row: 1 / span 2; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 18px; padding: 18px 14px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  background:
    linear-gradient(180deg, var(--bg-elev), var(--bg-elev)) padding-box;
  border-left: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; }
.brand:hover { text-decoration: none; }
.brand strong { font-family: var(--font-display); font-size: 1.06rem; font-weight: 800; letter-spacing: 0; line-height: 1.2; display: block; }
.brand small { display: block; color: var(--fg-3); font-size: .66rem; letter-spacing: .04em; text-transform: uppercase; }
.brand-mark {
  width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px; position: relative;
  background: var(--pitch); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .18);
}
.brand-mark::before { /* centre circle and halfway line, drawn like chalk on grass */
  content: ""; position: absolute; inset: 9px; border: 2px solid rgba(255, 255, 255, .85); border-radius: 50%;
}
.brand-mark::after { content: ""; position: absolute; top: 4px; bottom: 4px; left: calc(50% - 1px); width: 2px; background: rgba(255, 255, 255, .85); }
.nav-main, .nav-more { display: flex; flex-direction: column; gap: 3px; }
.nav-more { border-top: 1px solid var(--line); padding-top: 12px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 8px 12px; border-radius: var(--r-sm);
  color: var(--fg-2); text-decoration: none; font-weight: 700; border: 0; background: none; width: 100%; text-align: start;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav-item svg { width: 21px; height: 21px; flex: 0 0 21px; }
.nav-item:hover { background: var(--card); color: var(--fg); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--pitch-soft); color: var(--fg); box-shadow: inset -3px 0 0 var(--pitch); }
.nav-more .nav-item { font-weight: 600; font-size: .92rem; min-height: 40px; }
.side-status { margin-top: auto; font-size: .78rem; color: var(--fg-3); display: flex; flex-direction: column; gap: 8px; }
.side-status .status-line { display: flex; align-items: center; gap: 7px; }

.topbar { display: none; }
.main { min-width: 0; padding: 22px var(--gutter-r) 40px var(--gutter-l); outline: none; }
.view { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
.bottom-nav { display: none; }
.foot { max-width: 1180px; margin: 34px auto 0; border-top: 1px solid var(--line); padding-top: 14px; color: var(--fg-3); font-size: .78rem; display: flex; flex-wrap: wrap; gap: 6px 16px; }

/* ---------- page header ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.page-head .eyebrow { margin-bottom: 4px; }
.page-head p.lead { color: var(--fg-2); margin-top: 6px; max-width: 64ch; }
.eyebrow { font-size: .74rem; font-weight: 800; color: var(--pitch-strong); letter-spacing: .02em; display: inline-flex; gap: 6px; align-items: center; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.section-title h2 { font-size: 1.08rem; }
.section-title .more { font-size: .86rem; font-weight: 700; }

/* ---------- cards ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.tight { padding: 12px; }
.card h3 { margin-bottom: 8px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head h2, .card-head h3 { margin: 0; }
.panel { background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.grid { display: grid; gap: 14px; min-width: 0; }
.grid > * { min-width: 0; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.g-auto-s { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

/* ---------- buttons, chips, inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px;
  border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--card-2); color: var(--fg);
  font-weight: 700; text-decoration: none; white-space: nowrap; transition: background var(--t-fast), border-color var(--t-fast);
}
.btn:hover { background: var(--card); border-color: var(--fg-3); text-decoration: none; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--pitch); border-color: var(--pitch); color: var(--pitch-ink); }
.btn.primary:hover { background: var(--pitch-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--card-2); color: var(--fg); }
.btn.small { min-height: 36px; padding: 5px 12px; font-size: .86rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: var(--r-sm);
  border: 1px solid transparent; background: transparent; color: var(--fg-2); position: relative;
}
.icon-btn:hover { background: var(--card-2); color: var(--fg); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn .dot { position: absolute; top: 9px; left: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--led); box-shadow: 0 0 0 2px var(--bg-elev); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: transparent; color: var(--fg-2); font-weight: 700; font-size: .86rem; white-space: nowrap;
}
.chip:hover { color: var(--fg); border-color: var(--fg-3); }
.chip[aria-pressed="true"], .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: .74rem; font-weight: 800;
  background: var(--card-2); color: var(--fg-2); border: 1px solid var(--line); white-space: nowrap; line-height: 1.7;
}
.tag.pitch { background: var(--pitch-soft); color: var(--pitch-strong); border-color: transparent; }
.tag.led { background: var(--led-soft); color: var(--led); border-color: transparent; }
.tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag.scenario { background: transparent; color: var(--led); border: 1.5px dashed var(--led); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 800; padding: 1px 9px; border-radius: 999px; line-height: 1.8; white-space: nowrap; }
.pill.live { background: var(--live); color: #fff; }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
.pill.ht { background: var(--led); color: var(--led-ink); }
.pill.ft { background: var(--card-2); color: var(--fg-2); border: 1px solid var(--line-strong); }
.pill.soon { background: var(--pitch-soft); color: var(--pitch-strong); }
.pill.warn { background: var(--bad-soft); color: var(--bad); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
label.field { display: flex; flex-direction: column; gap: 5px; font-weight: 700; font-size: .88rem; color: var(--fg-2); min-width: 0; }
input[type="text"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-strong);
  background: var(--inset); color: var(--fg); font-weight: 600;
}
textarea { min-height: 120px; line-height: 1.75; resize: vertical; }
select { appearance: auto; }
input[type="range"] { width: 100%; accent-color: var(--pitch); min-height: 32px; }
input[type="checkbox"] { accent-color: var(--pitch); width: 20px; height: 20px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.switch:last-child { border-bottom: 0; }
.switch .s-text { display: flex; flex-direction: column; }
.switch .s-text small { color: var(--fg-3); font-size: .8rem; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; flex-wrap: wrap; max-width: 100%; }
.seg button { flex: 1 1 auto; }
.seg button { min-height: 40px; padding: 4px 14px; border: 0; background: transparent; color: var(--fg-2); font-weight: 700; border-inline-start: 1px solid var(--line); }
.seg button:first-child { border-inline-start: 0; }
.seg button[aria-pressed="true"] { background: var(--pitch); color: var(--pitch-ink); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  min-height: 46px; padding: 8px 16px; border: 0; background: none; color: var(--fg-2); font-weight: 800; font-family: var(--font-display);
  border-bottom: 3px solid transparent; white-space: nowrap; font-size: .98rem;
}
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--pitch); }

/* ---------- crests ---------- */
.crest { display: inline-block; flex: 0 0 auto; width: 34px; height: 40px; }
.crest.s { width: 22px; height: 26px; }
.crest.m { width: 30px; height: 35px; }
.crest.l { width: 52px; height: 61px; }
.crest.xl { width: 74px; height: 87px; }
.team-name { font-weight: 800; min-width: 0; overflow-wrap: break-word; }
.team-inline { display: inline-flex; align-items: center; gap: 7px; min-width: 0; vertical-align: middle; color: var(--fg); }
a.team-inline:hover { color: var(--pitch-strong); text-decoration: none; }
.team-inline .crest { width: 20px; height: 24px; }

/* ---------- scoreboard match card ---------- */
.sb {
  display: flex; flex-direction: column; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px 14px 12px; color: var(--fg); text-decoration: none; position: relative; min-width: 0; box-shadow: var(--shadow);
  transition: border-color var(--t-fast), transform var(--t-fast);
}
a.sb:hover { border-color: var(--line-strong); text-decoration: none; transform: translateY(-1px); }
.sb.watch { border-color: color-mix(in srgb, var(--led) 55%, var(--line)); }
.sb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--fg-3); font-weight: 700; }
.sb-teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
.sb-team { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; color: var(--fg); }
.sb-team .team-name { font-size: .96rem; line-height: 1.3; overflow-wrap: normal; word-break: normal; hyphens: none; }
.sb-team.wide { flex-direction: row; text-align: start; gap: 12px; }
.sb-team.wide.away { flex-direction: row-reverse; text-align: end; }
.sb-mid { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 70px; }
.sb-score {
  display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.sb-score .g { min-width: 34px; text-align: center; padding: 6px 4px 5px; background: var(--inset); border-radius: var(--r-xs); border: 1px solid var(--line); }
.sb-score .sep { color: var(--fg-3); font-size: 1rem; }
.sb-time { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sb-sub { font-size: .74rem; color: var(--fg-3); font-weight: 700; white-space: nowrap; }
.sb-line { font-size: .88rem; color: var(--fg-2); }
.sb-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .78rem; color: var(--fg-3); }
.delta { font-weight: 800; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }

/* ---------- probability bar ---------- */
.pbar { display: flex; flex-direction: column; gap: 6px; }
.pbar-track { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--inset); gap: 2px; }
.pbar.big .pbar-track { height: 20px; }
.pbar-seg { min-width: 3px; transition: flex-basis .4s ease; }
.pbar-seg.draw { background: var(--draw); }
.pbar-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: .82rem; }
.pbar-legend > div { display: flex; flex-direction: column; min-width: 0; }
.pbar-legend > div:nth-child(2) { align-items: center; text-align: center; }
.pbar-legend > div:nth-child(3) { align-items: flex-end; text-align: end; }
.pbar-legend .lab { display: flex; align-items: center; gap: 5px; color: var(--fg-2); font-weight: 700; min-width: 0; max-width: 100%; overflow: hidden; }
.pbar-legend .lab span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbar-legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; }
.pbar-legend .val { font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.pbar.big .pbar-legend .val { font-size: 1.7rem; }
.pbar-legend .chg { font-size: .74rem; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k-val { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .k-lab { font-weight: 700; font-size: .84rem; color: var(--fg-2); }
.kpi .k-sub { font-size: .76rem; color: var(--fg-3); }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 9px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-size: .76rem; color: var(--fg-3); font-weight: 800; background: var(--card-2); position: sticky; top: 0; z-index: 1; }
.tbl td.n, .tbl th.n { text-align: center; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--card-2); }
.tbl tr.zone-ucl td:first-child { box-shadow: inset -4px 0 0 var(--ucl); }
.tbl tr.zone-uel td:first-child { box-shadow: inset -4px 0 0 var(--uel); }
.tbl tr.zone-uecl td:first-child { box-shadow: inset -4px 0 0 var(--uecl); }
.tbl tr.zone-releg td:first-child { box-shadow: inset -4px 0 0 var(--releg); }
.tbl tr.mine td { background: var(--led-soft); }
.tbl .team-cell { display: flex; align-items: center; gap: 8px; }
.tbl .team-cell a { color: var(--fg); font-weight: 800; }
.tbl .team-cell a:hover { color: var(--pitch-strong); }
.cellbar { display: inline-flex; align-items: center; gap: 6px; min-width: 76px; }
.cellbar i { display: block; height: 7px; border-radius: 4px; background: var(--pitch); }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--fg-2); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.list > li, .list > .li { list-style: none; display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list > li:last-child, .list > .li:last-child { border-bottom: 0; }
ul.list, ol.list { padding: 0; margin: 0; }
.reason { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; align-items: center; }
.reason .r-bar { height: 8px; background: var(--inset); border-radius: 4px; position: relative; overflow: hidden; }
.reason .r-bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.reason .r-who { font-size: .76rem; font-weight: 800; color: var(--fg-3); }
.form-strip { display: inline-flex; gap: 4px; direction: rtl; }
.form-strip .f { width: 24px; height: 24px; border-radius: 6px; display: inline-grid; place-items: center; font-size: .72rem; font-weight: 800; color: #fff; }
.form-strip .f.W { background: var(--good); color: #04170c; }
.form-strip .f.D { background: var(--draw); }
.form-strip .f.L { background: var(--bad); }

/* ---------- notices, banners, states ---------- */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: var(--r); background: var(--card-2); border: 1px solid var(--line); font-size: .88rem; color: var(--fg-2); }
.notice svg { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 2px; }
.notice.led { background: var(--led-soft); border-color: transparent; color: var(--fg); }
.notice.bad { background: var(--bad-soft); border-color: transparent; color: var(--fg); }
.notice.pitch { background: var(--pitch-soft); border-color: transparent; color: var(--fg); }
.banner-slot:empty { display: none; }
.banner-slot { max-width: 1180px; margin: 0 auto 16px; }
.empty { padding: 26px 16px; text-align: center; color: var(--fg-3); border: 1.5px dashed var(--line-strong); border-radius: var(--r); }
.missing { color: var(--fg-3); font-weight: 700; cursor: help; border-bottom: 1px dotted var(--fg-3); }
.skel { background: linear-gradient(90deg, var(--card-2), var(--line), var(--card-2)); background-size: 200% 100%; animation: skel 1.2s linear infinite; border-radius: var(--r); }
@keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.boot { min-height: 50vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--fg-3); }
.boot-ball { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: var(--pitch); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- scenario areas (kept apart from official forecasts) ---------- */
.scenario { border: 1.5px dashed var(--led); border-radius: var(--r-lg); padding: 14px; background: linear-gradient(0deg, var(--led-soft), var(--led-soft)), var(--card); }
.scenario .scen-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }

/* ---------- charts ---------- */
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--fg-2); font-family: var(--font-body); font-size: 11px; }
.chart .axis line, .chart .grid-line { stroke: var(--line); }
.chart .tick-strong { stroke: var(--line-strong); }
.chart-note { font-size: .78rem; color: var(--fg-3); margin-top: 6px; }
.tl-wrap { position: relative; }
.tl-cursor-info { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .86rem; }
.ev-list { display: flex; flex-direction: column; gap: 4px; }
.ev-btn { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card-2); text-align: start; }
.ev-btn[aria-pressed="true"] { border-color: var(--led); background: var(--led-soft); }
.ev-min { font-family: var(--font-display); font-weight: 800; min-width: 40px; font-variant-numeric: tabular-nums; }
.ev-icon { width: 22px; height: 22px; flex: 0 0 22px; }

/* ---------- pitch drawings ---------- */
.pitch-wrap { background: color-mix(in srgb, var(--pitch) 22%, var(--card)); border-radius: var(--r); padding: 8px; }
.pitch-wrap svg { display: block; width: 100%; height: auto; }

/* ---------- score grid ---------- */
.sgrid { display: grid; gap: 2px; direction: ltr; font-variant-numeric: tabular-nums; }
.sgrid .c { aspect-ratio: 1 / 1; display: grid; place-items: center; font-size: .7rem; font-weight: 800; border-radius: 3px; color: var(--fg); min-width: 0; }
.sgrid .h { font-size: .72rem; color: var(--fg-3); display: grid; place-items: center; font-weight: 800; }

/* ---------- sheet (details panel; a bottom sheet on phones) ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0, 0, 0, .5); padding: 16px; }
.sheet-card {
  width: min(560px, 100%); max-height: min(86vh, 760px); overflow: auto; background: var(--card); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); padding: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }

/* ---------- toasts ---------- */
.toasts { position: fixed; z-index: 60; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r); font-weight: 700; font-size: .9rem; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }

/* ---------- studio ---------- */
.studio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.studio-preview { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.studio-preview canvas { width: 100%; max-width: 420px; height: auto; border-radius: var(--r); box-shadow: 0 14px 40px rgba(0, 0, 0, .35); background: #000; }
.studio-preview img.export { max-width: 420px; width: 100%; border-radius: var(--r); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line-strong); padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--fg); }
.story-card { display: flex; flex-direction: column; gap: 8px; }
.story-card .ev { display: flex; flex-wrap: wrap; gap: 6px; }
.story-card .ev span { background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px 8px; font-size: .78rem; }

/* ---------- position distribution heat cells ---------- */
.heat-row { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 1px; direction: rtl; }
.heat-row i { display: block; height: 18px; border-radius: 2px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  :root { --side-w: 216px; }
  .g-main { grid-template-columns: minmax(0, 1fr); }
  .studio { grid-template-columns: minmax(0, 1fr); }
  .studio-preview { position: static; }
}
@media (max-width: 860px) {
  .g-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding: 6px var(--gutter-r) 6px var(--gutter-l); background: var(--bg-elev); border-bottom: 1px solid var(--line);
  }
  .brand-mini { gap: 8px; }
  .brand-mini .brand-mark { width: 30px; height: 30px; flex-basis: 30px; border-radius: 8px; }
  .brand-mini .brand-mark::before { inset: 7px; }
  .brand-mini strong { font-size: .98rem; }
  .topbar-actions { display: flex; align-items: center; gap: 2px; }
  .main { padding: 14px var(--gutter-r) calc(92px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; inset: auto 0 0 0; z-index: 25;
    background: var(--bg-elev); border-top: 1px solid var(--line);
    padding: 4px var(--gutter-r) calc(4px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  }
  .bottom-nav .nav-item { flex-direction: column; gap: 2px; min-height: 54px; padding: 4px 2px; font-size: .72rem; justify-content: center; text-align: center; border-radius: var(--r-sm); }
  .bottom-nav .nav-item[aria-current="page"] { box-shadow: none; color: var(--pitch-strong); background: var(--pitch-soft); }
  .g-2, .g-3 { grid-template-columns: minmax(0, 1fr); }
  .g-auto { grid-template-columns: minmax(0, 1fr); }
  .sheet { place-items: end stretch; padding: 0; }
  .sheet-card { width: 100%; max-height: 82vh; border-radius: var(--r-lg) var(--r-lg) 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .toasts { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .reason { grid-template-columns: minmax(0, 1fr) 78px; }
  .card { padding: 14px; }
}
@media (max-width: 420px) {
  body { font-size: 14.5px; }
  .sb-score { font-size: 1.45rem; }
  .sb-score .g { min-width: 28px; }
  .sb-team:not(.wide) .crest { width: 26px; height: 31px; }
  .sb-team .team-name { font-size: .9rem; }
  .pbar.big .pbar-legend .val { font-size: 1.35rem; }
  .kpi .k-val { font-size: 1.3rem; }
  .tabs button { padding: 8px 12px; font-size: .92rem; }
}
@media (max-width: 760px) {
  .sb-team.wide, .sb-team.wide.away { flex-direction: column; text-align: center; gap: 6px; }
  .sb-team.wide .stack { align-items: center !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
:root.reduce-motion *, :root.reduce-motion *::before, :root.reduce-motion *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }

/* =====================================================================================================
   Version 3: scores-app home (matches by day across competitions), news, competitions, standings, more.
   The ground is a mown pitch: faint stripes and chalk lines behind solid cards, so text never sits on
   the pattern and contrast stays the same as before.
   ===================================================================================================== */
:root { --turf-a: #0f1612; --turf-b: #121a15; --chalk-line: rgba(232, 238, 233, .05); --cc: var(--pitch); }
:root[data-theme="light"] { --turf-a: #e9efe6; --turf-b: #e2eade; --chalk-line: rgba(17, 60, 30, .07); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --turf-a: #e9efe6; --turf-b: #e2eade; --chalk-line: rgba(17, 60, 30, .07); } }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(120% 70% at 50% -10%, transparent 55%, var(--bg) 100%),
    repeating-linear-gradient(90deg, var(--turf-a) 0 72px, var(--turf-b) 72px 144px);
  background-attachment: fixed;
}
.app::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 1;
  background:
    radial-gradient(circle at 50% 0, transparent 108px, var(--chalk-line) 109px, var(--chalk-line) 111px, transparent 112px),
    linear-gradient(var(--chalk-line), var(--chalk-line)) 50% 0 / 2px 0 no-repeat,
    linear-gradient(90deg, transparent calc(50% - 160px), var(--chalk-line) calc(50% - 160px), var(--chalk-line) calc(50% - 158px), transparent calc(50% - 158px), transparent calc(50% + 158px), var(--chalk-line) calc(50% + 158px), var(--chalk-line) calc(50% + 160px), transparent calc(50% + 160px)) 0 0 / 100% 64px no-repeat;
}
.main, .sidebar, .topbar, .bottom-nav { position: relative; z-index: 1; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition: none !important; animation: none !important; }
:root[data-fs="s"] .view { zoom: .93; }
:root[data-fs="l"] .view { zoom: 1.1; }

.kpi-lab { font-weight: 700; font-size: .84rem; color: var(--fg-2); }
.kpi-val { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi-sub { font-size: .78rem; color: var(--fg-3); }

/* page head of the hub pages */
.hub-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 14px; flex-wrap: wrap; }
.hub-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 4.6vw, 2rem); line-height: 1.15; margin: 0; }
.hub-lead { margin: 4px 0 0; color: var(--fg-2); font-size: .9rem; max-width: 62ch; }
.hub-actions { display: flex; gap: 6px; align-items: center; }
.hub-note { display: flex; gap: 8px; align-items: flex-start; color: var(--fg-3); font-size: .8rem; margin: 14px 2px 0; }
.hub-note svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 3px; }
.hub-search { width: 100%; margin: 0 0 10px; min-height: 44px; }
.hub-body { display: flex; flex-direction: column; gap: 12px; }

.live-pill { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 4px 14px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--card); color: var(--fg); font-weight: 800; font-size: .86rem; cursor: pointer; }
.live-pill[aria-pressed="true"] { background: var(--live); border-color: var(--live); color: #fff; }
.live-pill:disabled { opacity: .55; cursor: default; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(255, 91, 79, .6); animation: pulse 1.8s infinite; }
.live-pill[aria-pressed="true"] .live-dot { background: #fff; }
.live-pill:disabled .live-dot { animation: none; background: var(--fg-3); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 91, 79, .55); } 70% { box-shadow: 0 0 0 8px rgba(255, 91, 79, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 91, 79, 0); } }
.cal-btn { position: relative; overflow: hidden; cursor: pointer; }
.cal-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

/* date strip */
.datestrip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 0 6px; scrollbar-width: none; }
.datestrip::-webkit-scrollbar { display: none; }
.dchip { position: relative; flex: 0 0 auto; min-width: 62px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0; padding: 4px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--fg-2); cursor: pointer; font-family: var(--font-body); }
.dchip-d { font-weight: 800; font-size: .82rem; }
.dchip-n { font-size: .74rem; color: var(--fg-3); }
.dchip-dot { position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--pitch); }
.dchip.on { background: var(--pitch); border-color: var(--pitch); color: var(--pitch-ink); }
.dchip.on .dchip-n { color: var(--pitch-ink); opacity: .8; }
.dchip.on .dchip-dot { background: var(--pitch-ink); }
.dchip:not(.has):not(.on) { opacity: .62; }

/* competition group */
.comp-badge { --sz: 28px; width: var(--sz); height: var(--sz); flex: 0 0 var(--sz); border-radius: 9px; display: inline-grid; place-items: center;
  background: var(--cc); color: #fff; font: 800 .74rem/1 var(--font-display); letter-spacing: .02em; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .22); }
.comp-badge.xs { --sz: 20px; border-radius: 6px; font-size: .6rem; }
.comp-badge.lg { --sz: 40px; border-radius: 12px; font-size: .95rem; }
.comp-badge.xl { --sz: 64px; border-radius: 18px; font-size: 1.5rem; }
.cgroup { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
.cgroup-head { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 4px; border-bottom: 1px solid var(--line); background: var(--card-2); }
.cgroup-toggle { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 10px; background: transparent; border: 0; color: var(--fg); cursor: pointer; text-align: start; font-family: var(--font-body); }
.cgroup-name { font-weight: 800; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cgroup-sub { color: var(--fg-3); font-size: .78rem; white-space: nowrap; }
.cgroup-chev { margin-inline-start: auto; display: inline-flex; color: var(--fg-3); transition: transform var(--t-fast); }
.cgroup-chev svg { width: 18px; height: 18px; }
.cgroup-chev.closed { transform: rotate(90deg); }
.cgroup-more { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--fg-3); }
.cgroup-more svg { width: 18px; height: 18px; }
.cgroup-more:hover { background: var(--card); color: var(--fg); }
.star-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--fg-3); cursor: pointer; }
.star-btn svg { width: 20px; height: 20px; }
.star-btn.on { color: var(--title); }
.star-btn.on svg { fill: currentColor; }
.cgroup-rows { display: flex; flex-direction: column; }
section.stack > .cgroup-rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }

/* match row */
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 88px minmax(0, 1fr); grid-template-areas: "home mid away" "comp comp comp" "bar bar bar";
  align-items: center; column-gap: 8px; padding: 12px 12px 10px; color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); position: relative; }
.mrow:last-child { border-bottom: 0; }
.mrow:hover { background: var(--card-2); text-decoration: none; }
.mrow.fav { box-shadow: inset -3px 0 0 var(--title); }
.mrow.is-live { background: linear-gradient(90deg, transparent, var(--led-soft)); }
.mrow-team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mrow-team.home { grid-area: home; justify-content: flex-start; }
.mrow-team.away { grid-area: away; justify-content: flex-start; flex-direction: row-reverse; }
.mrow-team .nm { font-weight: 800; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow-team.lost .nm { color: var(--fg-3); font-weight: 700; }
.mrow-mid { grid-area: mid; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 44px; }
.mrow-mid.live { flex-direction: row; gap: 6px; }
.mrow-time { font: 800 1.08rem/1.2 var(--font-display); }
.mrow-score { display: inline-flex; gap: 6px; align-items: baseline; font: 800 1.3rem/1.15 var(--font-display); }
.mrow-score i { font-style: normal; color: var(--fg-3); font-weight: 700; }
.mrow-sub { font-size: .7rem; color: var(--fg-3); white-space: nowrap; }
.mrow-sub.live-t { color: var(--live); font-weight: 800; }
.mrow-comp { grid-area: comp; display: flex; gap: 6px; align-items: center; color: var(--fg-3); font-size: .74rem; margin-top: 6px; }
.mini { grid-area: bar; margin-top: 8px; display: grid; gap: 2px; }
.mini-track { display: flex; height: 5px; border-radius: 3px; overflow: hidden; gap: 2px; background: var(--inset); }
.mini-track i { display: block; height: 100%; min-width: 2px; }
.mini-nums { display: flex; justify-content: space-between; font-size: .7rem; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.mini-nums .best { color: var(--fg); font-weight: 800; }
.ring { width: 40px; height: 40px; flex: 0 0 40px; }
.ring-track { fill: none; stroke: var(--line-strong); stroke-width: 3; }
.ring-prog { fill: none; stroke: var(--live); stroke-width: 3; stroke-linecap: round; }
.ring-goal { fill: var(--led); stroke: var(--card); stroke-width: 1; }
.ring-text { fill: var(--fg); font: 800 10px var(--font-display); }
.empty-day { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 16px; text-align: center; color: var(--fg-2);
  background: var(--card); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); }

<script>
/* ---- js/core.js ---- */
/* core.js: shared helpers, data access, saved user data and routing. Plain script, no build step.
   Everything lives under window.ZS. */
(function () {
  "use strict";
  const ZS = (window.ZS = window.ZS || {});

  // ------------------------------------------------------------------ DOM helpers
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  /** h("div.card#x", {attrs}, ...children): tiny element builder. Strings become text nodes (never HTML). */
  function h(tag, attrs, ...kids) {
    const m = /^([a-z0-9]+)?((?:[.#][\w-]+)*)$/i.exec(tag);
    const el = document.createElement((m && m[1]) || "div");
    if (m && m[2]) {
      for (const part of m[2].match(/[.#][\w-]+/g)) {
        if (part[0] === ".") el.classList.add(part.slice(1));
        else el.id = part.slice(1);
      }
    }
    if (attrs !== null && attrs !== undefined && (typeof attrs !== "object" || attrs instanceof Node || Array.isArray(attrs))) {
      kids.unshift(attrs); // a first child that is a number (0 included), text, node or list
      attrs = null;
    }
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className += (el.className ? " " : "") + v;
      else if (k === "style" && typeof v === "object") {
        for (const [sk, sv] of Object.entries(v)) {
          if (sk.startsWith("--")) el.style.setProperty(sk, sv); else el.style[sk] = sv;
        }
      }
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "html") el.innerHTML = v; // only ever used with markup built here (SVG), never with data
      else if (k === "dataset") Object.assign(el.dataset, v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    append(el, kids);
    return el;
  }
  function append(el, kids) {
    for (const k of kids.flat(Infinity)) {
      if (k === null || k === undefined || k === false || k === "") continue;
      el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
    }
    return el;
  }
  function svgEl(markup) {
    const t = document.createElement("template");
    t.innerHTML = markup.trim();
    return t.content.firstChild;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ------------------------------------------------------------------ numbers and words
  const isNum = (x) => typeof x === "number" && isFinite(x);
  const PCT = "%";
  function pct(p, digits = 0) {
    if (!isNum(p)) return "—";
    const v = 100 * p;
    if (digits === 0 && v > 0 && v < 0.5) return "<1" + PCT;
    if (digits === 0 && v < 100 && v > 99.5) return ">99" + PCT;
    return v.toFixed(digits) + PCT;
  }
  function num(x, digits = 0) { return isNum(x) ? Number(x).toFixed(digits) : "—"; }
  function signed(x, digits = 0) {
    if (!isNum(x)) return "—";
    const r = Number(x).toFixed(digits);
    if (Number(r) === 0) return (0).toFixed(digits);
    return (x > 0 ? "+" : "−") + Math.abs(x).toFixed(digits);
  }
  /** change in percentage points, e.g. +4.2 */
  const pp = (d, digits = 1) => signed(100 * d, digits);
  /** Arabic counted noun: 1 -> one, 2 -> two, 3-10 -> "N few", 11+ -> "N many" */
  function countAr(n, one, two, few, many) {
    n = Math.round(n);
    if (n === 1) return one;
    if (n === 2) return two;
    if ((n >= 3 && n <= 10) || n === 0) return `${n} ${few}`;
    return `${n} ${many || one}`;
  }
  /** score text that reads correctly inside Arabic sentences: home goals sit next to the home team */
  const scoreText = (h, a) => `${h} – ${a}`;

  // ------------------------------------------------------------------ dates (Baghdad)
  const TZ = "Asia/Baghdad";
  const fmtCache = {};
  function fmt(opts) {
    const key = JSON.stringify(opts);
    if (!fmtCache[key]) {
      try { fmtCache[key] = new Intl.DateTimeFormat("ar-IQ-u-nu-latn", { timeZone: TZ, ...opts }); }
      catch (e) { fmtCache[key] = new Intl.DateTimeFormat("ar", { ...opts }); }
    }
    return fmtCache[key];
  }
  const toDate = (iso) => (iso instanceof Date ? iso : iso ? new Date(iso) : null);
  function dateLong(iso) { const d = toDate(iso); return d && !isNaN(d) ? fmt({ weekday: "long", day: "numeric", month: "long" }).format(d) : "—"; }
  function dateShort(iso) { const d = toDate(iso); return d && !isNaN(d) ? fmt({ day: "numeric", month: "short" }).format(d) : "—"; }
  function timeHM(iso) {
    const d = toDate(iso);
    if (!d || isNaN(d)) return "—";
    let h12 = false;
    try { h12 = ZS.store && ZS.store.prefs().clock === "12"; } catch (e) { /* prefs not ready */ }
    return fmt({ hour: h12 ? "numeric" : "2-digit", minute: "2-digit", hour12: h12 }).format(d);
  }
  function dateTime(iso) { const d = toDate(iso); return d && !isNaN(d) ? fmt({ day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false }).format(d) : "—"; }
  function dayKey(iso) { // YYYY-MM-DD in Baghdad
    const d = toDate(iso); if (!d || isNaN(d)) return "";
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
    return p;
  }
  function ago(iso, now) {
    const d = toDate(iso); if (!d || isNaN(d)) return "—";
    const s = Math.max(0, ((now || Date.now()) - d.getTime()) / 1000);
    if (s < 60) return "قبل لحظات";
    const m = s / 60, hr = m / 60, dy = hr / 24;
    if (m < 60) return "قبل " + countAr(m, "دقيقة", "دقيقتين", "دقائق", "دقيقة");
    if (hr < 24) return "قبل " + countAr(hr, "ساعة", "ساعتين", "ساعات", "ساعة");
    return "قبل " + countAr(dy, "يوم", "يومين", "أيام", "يوم");
  }
  function until(iso, now) {
    const d = toDate(iso); if (!d || isNaN(d)) return "";
    const s = (d.getTime() - (now || Date.now())) / 1000;
    if (s <= 0) return "";
    const m = s / 60, hr = m / 60, dy = hr / 24;
    if (m < 60) return "بعد " + countAr(Math.ceil(m), "دقيقة", "دقيقتين", "دقائق", "دقيقة");
    if (hr < 24) return "بعد " + countAr(Math.round(hr), "ساعة", "ساعتين", "ساعات", "ساعة");
    return "بعد " + countAr(Math.round(dy), "يوم", "يومين", "أيام", "يوم");
  }

  // ------------------------------------------------------------------ colours
  function hexRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return [128, 128, 128];
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function lum(hex) {
    const c = hexRgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  const inkOn = (hex) => (lum(hex) > 0.42 ? "#0b0f0c" : "#ffffff");
  function colourDist(a, b) {
    const x = hexRgb(a), y = hexRgb(b);
    return Math.sqrt((x[0] - y[0]) ** 2 * 0.3 + (x[1] - y[1]) ** 2 * 0.59 + (x[2] - y[2]) ** 2 * 0.11);
  }
  /** colours for a home/away pair that stay apart from each other and from the draw grey */
  function pairColours(home, away) {
    const hc = home.color, ac0 = away.color;
    let ac = ac0;
    if (colourDist(hc, ac0) < 70) {
      const alt = (away.kit || []).find((k) => k && colourDist(k, hc) >= 70 && lum(k) < 0.85);
      ac = alt || (lum(hc) > 0.4 ? "#2a3b8f" : "#d9d9d9");
    }
    return [hc, ac];
  }

  // ------------------------------------------------------------------ data access
  const DATA_BASE = "data/";
  const cache = new Map();
  async function getJSON(path, { fresh = false, retries = 2 } = {}) {
    if (!fresh && cache.has(path)) return cache.get(path);
    const p = (async () => {
      let lastErr;
      for (let i = 0; i <= retries; i++) {
        try {
          const r = await fetch(DATA_BASE + path + (fresh ? (path.includes("?") ? "&" : "?") + "t=" + Date.now() : ""), { cache: fresh ? "no-store" : "default" });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
          return await r.json();
        } catch (e) {
          lastErr = e;
          await new Promise((res) => setTimeout(res, 300 * (i + 1)));
        }
      }
      throw new Error(`تعذّر تحميل ${path}: ${lastErr && lastErr.message}`);
    })();
    cache.set(path, p);
    p.catch(() => cache.delete(path));
    return p;
  }
  function invalidate() { cache.clear(); }

  const D = {}; // loaded core files
  async function loadCore() {
    const [meta, teams, fixtures] = await Promise.all([getJSON("meta.json"), getJSON("teams.json"), getJSON("fixtures.json")]);
    D.meta = meta; D.teams = teams; D.fixtures = fixtures.fixtures;
    for (const f of D.fixtures) f.comp = "ESP1";
    D.fixturesById = new Map(D.fixtures.map((f) => [f.match_id, f]));

  async function matchFile(mid) {

  // ------------------------------------------------------------------ environment

    if (window.ZS_BUILD !== "web") try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 1500);
      const r = await fetch("api/health", { signal: ctl.signal, cache: "no-store" });
      clearTimeout(t);

        const js = await r.json();

      }

    if (window.claude && typeof window.claude.use === "function") {

  function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } }
  const DEFAULT_PREFS = {
    theme: "dark", track: "", fav_teams: [], fav_players: [], watchlist: [], filters: {},
    alerts: { forecast_change: true, reports: true, stories: true, threshold_pp: 5, frequency: "visit" },

      const res = (f) => (f.score ? (f.score[0] > f.score[1] ? "H" : f.score[0] === f.score[1] ? "D" : "A") : null);
      const rows = {};
      const weekly = {};
      const add = (who, f, pick, score, at) => {
        if (!f || !f.score || !f.kickoff_utc) return;
        if (at && new Date(at) >= new Date(f.kickoff_utc)) return; // late picks never count
        const pts = (pick === res(f) ? 1 : 0) + (score === `${f.score[0]}-${f.score[1]}` ? 2 : 0);
        const r = (rows[who] = rows[who] || { player: who, points: 0, played: 0, exact: 0, right: 0 });
        r.points += pts; r.played += 1; r.exact += pts === 3 ? 1 : 0; r.right += pts >= 1 ? 1 : 0;
        const wk = isoWeek(f.kickoff_utc);
        const w = (weekly[wk] = weekly[wk] || {});
        w[who] = (w[who] || 0) + pts;
      };
      for (const p of picks) add(p.player, D.fixturesById.get(p.match_id), p.pick, p.score, p.at);
      // the computer: its most likely outcome and most likely score, issued before kick-off
      const pickedIds = new Set(picks.map((p) => p.match_id));

      }
      const total = Object.values(rows).sort((a, b) => b.points - a.points || b.exact - a.exact);
      const weeks = Object.keys(weekly).sort().reverse().map((wk) => ({ week: wk, rows: Object.entries(weekly[wk]).map(([player, points]) => ({ player, points })).sort((a, b) => b.points - a.points) }));
      return { total, weeks };
    },
  };
  function isoWeek(iso) {

    const wk = 1 + Math.round(((d - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);

    const view = $("#view");
    clear(view);
    ZS.emit("route", r);

      console.error(e);

      const main = $("#main");
      if (main && document.activeElement && document.activeElement.closest && document.activeElement.closest(".nav-item")) main.focus({ preventScroll: true });

  Object.assign(ZS, {
    $, $$, h, append, svgEl, clear, esc, isNum, pct, num, signed, pp, countAr, scoreText, PCT,
    dateLong, dateShort, timeHM, dateTime, dayKey, ago, until, isoWeek,
    hexRgb, lum, inkOn, colourDist, pairColours,
    getJSON, invalidate, loadCore, D, team, teamByKey, matchFile,
    env, detectEnv, store, challenge, toast, routes, go, href, render, current: () => current,
  });
})();

/* ---- js/models.js ---- */
/* models.js: the same maths as the Python package, ported for scenarios in the browser.
   - Dixon-Coles score matrix               (zsc/dixon_coles.py score_matrix)
   - in-play model version 2                (zsc/inplay.py InPlayModel)
   - season simulation with La Liga ties    (zsc/simulate.py + zsc/standings.py), run in a Web Worker
   Scenario numbers are always labelled as scenarios and kept apart from the official forecasts. */
(function () {
  "use strict";
  const ZS = (window.ZS = window.ZS || {});
  const MAX_GOALS = 10;

  function poissonPmf(k, lam) {
    // stable for the small rates of football
    let p = Math.exp(-lam);
    for (let i = 1; i <= k; i++) p *= lam / i;
    return p;
  }
  /** P(home = x, away = y), (G+1) x (G+1), Dixon-Coles low-score correction, renormalised */
  function scoreMatrix(lam, mu, rho, G = MAX_GOALS) {
    const ph = [], pa = [];
    for (let k = 0; k <= G; k++) { ph.push(poissonPmf(k, lam)); pa.push(poissonPmf(k, mu)); }
    const m = [];
    let s = 0;
    for (let i = 0; i <= G; i++) {
      const row = [];
      for (let j = 0; j <= G; j++) {
        let v = ph[i] * pa[j];
        if (i === 0 && j === 0) v *= 1 - lam * mu * rho;
        else if (i === 0 && j === 1) v *= 1 + lam * rho;
        else if (i === 1 && j === 0) v *= 1 + mu * rho;
        else if (i === 1 && j === 1) v *= 1 - rho;
        v = Math.max(0, v);
        row.push(v); s += v;
      }
      m.push(row);
    }
    for (const row of m) for (let j = 0; j < row.length; j++) row[j] /= s;
    return m;
  }
  function outcomeProbs(m) {
    let h = 0, d = 0, a = 0;
    for (let i = 0; i < m.length; i++) for (let j = 0; j < m[i].length; j++) {
      if (i > j) h += m[i][j]; else if (i === j) d += m[i][j]; else a += m[i][j];
    }
    return [h, d, a];
  }
  function topScores(m, k = 3) {
    const cells = [];
    for (let i = 0; i < m.length; i++) for (let j = 0; j < m[i].length; j++) cells.push([i, j, m[i][j]]);
    cells.sort((x, y) => y[2] - x[2]);
    return cells.slice(0, k);
  }

  // ------------------------------------------------------------------ in-play (version 2)
  class InPlay {
    constructor(js) {
      this.s = js.first_half_share;
      this.added = js.second_half_added ?? 5;
      const toObj = (o) => { const out = {}; for (const [k, v] of Object.entries(o || {})) out[Number(k)] = Number(v); return out; };
      this.kh = toObj(js.k_home); this.ka = toObj(js.k_away);
      this.bh = toObj(js.b_home); this.ba = toObj(js.b_away);
      this.redOwn = js.red_own; this.redOpp = js.red_opp;
      this.ramp = js.ramp ?? false;
      this.rhoMode = js.rho_mode ?? "none";
      this.version = js.version || "inplay";
    }
    get slope() { const s = this.s; return (45 - 90 * s) / (4050 * s - 1012.5); }
    cum(t) { const c = this.slope; t = Math.min(Math.max(t, 0), 90); return (t + (c * t * t) / 2) / (90 + c * 4050); }
    eff(minute, period) {
      if (period == null) period = minute <= 45 ? 1 : 2;
      if (period === 1) return Math.min(minute, 45);
      const a = this.added;
      return 45 + (Math.max(0, Math.min(minute, 90 + a) - 45) * 45) / (45 + a);
    }
    remaining(minute, period) { return 1 - this.cum(this.eff(minute, period)); }
    info(minute, period) { return this.ramp ? Math.min(1, this.cum(this.eff(minute, period)) / this.cum(45)) : 1; }
    rhoRem(rho, minute, period) {
      if (rho == null || this.rhoMode === "none") return 0;
      if (this.rhoMode === "full") return rho;
      return rho * this.remaining(minute, period);
    }
    rates(lam, mu, minute, hg, ag, rh = 0, ra = 0, period) {
      const r = this.remaining(minute, period), w = this.info(minute, period);
      const d = Math.max(-2, Math.min(2, hg - ag));
      const z = Math.log(Math.max(lam, 1e-9) / Math.max(mu, 1e-9));
      let rl = lam * r * Math.pow(this.kh[d] * Math.exp((this.bh[d] || 0) * z), w);
      let rm = mu * r * Math.pow(this.ka[d] * Math.exp((this.ba[d] || 0) * z), w);
      const man = rh - ra;
      if (man > 0) { rl *= Math.pow(this.redOwn, man); rm *= Math.pow(this.redOpp, man); }
      else if (man < 0) { rl *= Math.pow(this.redOpp, -man); rm *= Math.pow(this.redOwn, -man); }
      return [rl, rm];
    }
    /** final-score matrix offset by the current score: m[i][j] = P(final i - j) */
    finalMatrix(lam, mu, minute, hg, ag, rh = 0, ra = 0, period, rho) {
      const [rl, rm] = this.rates(lam, mu, minute, hg, ag, rh, ra, period);
      const add = scoreMatrix(rl, rm, this.rhoRem(rho, minute, period));
      const G = MAX_GOALS + Math.max(hg, ag) + 1;
      const out = Array.from({ length: G }, () => new Array(G).fill(0));
      for (let i = 0; i <= MAX_GOALS; i++) for (let j = 0; j <= MAX_GOALS; j++) out[hg + i][ag + j] = add[i][j];
      return out;
    }
    probs(lam, mu, minute, hg, ag, rh = 0, ra = 0, period, rho) {

  // each draw is simulated several times; every remaining match gets ONE uniform random number per season, so a

  function workerMain() {

    function pmf(k, l) { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }
    const G = 11;

/* charts.js: small SVG charts drawn by hand (no library).

    svg += `<path d="${path(ptsH, base)}" fill="${hc}" fill-opacity=".85"/>`;
    svg += `<path d="${path(ptsD, ptsH)}" fill="var(--draw)" fill-opacity=".55"/>`;

        h("span.sb-sub", f.status === "HT" ? "نهاية الشوط الأول" : "مباشر"))
      : f.score
      ? h("div.sb-mid",
        h("div.sb-score", { "aria-label": `النتيجة ${H.ar} ${f.score[0]}، ${A.ar} ${f.score[1]}` }, h("span.g", f.score[0]), h("span.sep", "–"), h("span.g", f.score[1])),
        f.ht ? h("span.sb-sub", `الشوط الأول ${ZS.scoreText(f.ht[0], f.ht[1])}`) : null)
      : h("div.sb-mid",
        h("span.sb-time", f.kickoff_utc ? ZS.timeHM(f.kickoff_utc) : "—"),
        h("span.sb-sub", f.kickoff_utc ? ZS.dateShort(f.kickoff_utc) : "الموعد غير محدد"));
    const p = f.p || null;
    const card = h("a.sb" + (watched ? ".watch" : ""), { href: ZS.href("match", f.match_id) },
      h("div.sb-top",
        h("span", `الجولة ${f.matchday}`, watched ? " · ★ متابَعة" : ""),
        pill(f)),
      h("div.sb-teams",
        h("div.sb-team", crest(f.home, "m"), h("span.team-name", H.ar)),
        mid,
        h("div.sb-team.away", crest(f.away, "m"), h("span.team-name", A.ar))),
      compact ? null : probBar(f.home, f.away, p, { prev }),
      line ? h("div.sb-line", line) : null,
      compact ? null : h("div.sb-foot",
        h("span", f.score ? (f.retro_hit === true ? "✓ الأرجح صار" : f.retro_hit === false ? "✗ الأرجح ما صار" : "") : (f.importance ? `أهمية ${num(f.importance, 0)}` : "")),
        h("span", f.score ? "توقع استرجاعي" : (p ? "توقع الحاسوب" : ""))));
    return card;
  }

  // ------------------------------------------------------------------ states
  function errorCard(err, retry) {
    return h("div.card", h("div.notice.bad", icon("warn"),
      h("div.stack", { style: { gap: "8px" } },
        h("strong", "صار خطأ بتحميل هالصفحة"),
        h("span.small", String((err && err.message) || err)),
        retry ? h("div", h("button.btn.small", { type: "button", onclick: retry }, icon("refresh"), "حاول مرة ثانية")) : null)));
  }
  function skeleton(n = 3, height = 120) {
    return h("div.grid.g-auto", Array.from({ length: n }, () => h("div.skel", { style: { height: height + "px" } })));
  }
  function empty(text) { return h("div.empty", text); }
  function pageHead(title, lead, actions, eyebrow) {
    return h("div.page-head",
      h("div", eyebrow ? h("div.eyebrow", eyebrow) : null, h("h1", title), lead ? h("p.lead", lead) : null),
      actions ? h("div.row", actions) : null);
  }
  function section(title, content, more) {
    return h("section.stack", h("div.section-title", h("h2", title), more || null), content);
  }

  // ------------------------------------------------------------------ sheet (details; bottom sheet on phones)
  let lastFocus = null;
  function openSheet(title, content) {
    const sheet = ZS.$("#sheet");
    lastFocus = document.activeElement;
    ZS.clear(sheet);
    const close = h("button.icon-btn", { type: "button", "aria-label": "سد", onclick: closeSheet }, icon("x"));
    const card = h("div.sheet-card", { role: "dialog", "aria-modal": "true", "aria-label": title },
      h("div.sheet-head", h("h2", title), close), content);
    sheet.appendChild(card);
    sheet.hidden = false;
    sheet.onclick = (ev) => { if (ev.target === sheet) closeSheet(); };
    close.focus();
  }
  function closeSheet() {
    const sheet = ZS.$("#sheet");
    sheet.hidden = true;
    ZS.clear(sheet);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !ZS.$("#sheet").hidden) closeSheet(); });

  /** a term with an explanation from the glossary */
  function term(key, text) {
    const g = (ZS.D.meta && ZS.D.meta.glossary) || {};
    if (!g[key]) return h("span", text);
    return h("button.btn.ghost.small", { type: "button", style: { minHeight: "28px", padding: "0 6px", textDecoration: "underline dotted" },
      onclick: () => openSheet(text, h("p", g[key])) }, text);
  }

  function trackLabel(track) {
    const map = (ZS.D.meta && ZS.D.meta.tracks_ar) || {};
    return map[track] || track;
  }
  function trackTag(track) {
    const cls = track === "live" ? "led" : track === "scenario" ? "scenario" : "pitch";
    return h("span.tag." + cls, trackLabel(track));
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); ZS.toast("انسخ"); return true; }
    catch (e) { ZS.toast("ما گدرت أنسخ تلقائياً: ظلّلي النص وانسخيه"); return false; }
  }
  async function saveFile(filename, blob) {
    const dl = ZS.env.downloads;
    if (dl) {
      try { await dl.save({ filename, data: blob }); ZS.toast("انحفظ الملف"); return true; }
      catch (e) { if (e && e.code === "declined") return false; }
    }
    try {
      const url = URL.createObjectURL(blob);
      const a = h("a", { href: url, download: filename });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch (e) { return false; }
  }

  ZS.ui = { icon, crest, teamInline, probBar, statusOf, pill, kickoffLabel, matchCard, errorCard, skeleton, empty, pageHead, section, openSheet, closeSheet, term, trackLabel, trackTag, copyText, saveFile };
})();

/* ---- js/pages/today.js ---- */
/* Today: what is on, who the model favours, what it means for the season, which story to post. */
(function () {
  "use strict";
  const ZS = window.ZS;
  const { h, pct, num, team, D } = ZS;
  const ui = () => ZS.ui;

  function pickDay(fixtures, now) {
    const today = ZS.dayKey(new Date(now));
    const todays = fixtures.filter((f) => f.kickoff_utc && ZS.dayKey(f.kickoff_utc) === today);
    if (todays.length) return { label: "مباريات اليوم", list: todays, today: true };
    const next = fixtures.filter((f) => f.kickoff_utc && new Date(f.kickoff_utc).getTime() > now && !f.score)
      .sort((a, b) => a.kickoff_utc.localeCompare(b.kickoff_utc));
    if (!next.length) return { label: "ماكو مباريات قادمة بالجدول", list: [], today: false };
    const day = ZS.dayKey(next[0].kickoff_utc);
    return { label: `المباريات الجاية: ${ZS.dateLong(next[0].kickoff_utc)}`, list: next.filter((f) => ZS.dayKey(f.kickoff_utc) === day), today: false };
  }

  async function render(view) {
    const now = Date.now();
    const fx = D.fixtures;
    const day = pickDay(fx, now);
    const md = day.list.length ? day.list[0].matchday : null;
    const fav = day.list.filter((f) => f.p).map((f) => ({ f, best: Math.max(...f.p), i: f.p.indexOf(Math.max(...f.p)) }))
      .sort((a, b) => b.best - a.best)[0];
    const leadBits = [];
    if (day.list.length) leadBits.push(`${ZS.countAr(day.list.length, "مباراة وحدة", "مباراتين", "مباريات", "مباراة")} ${day.today ? "اليوم" : "بالموعد الجاي"}.`);
    if (fav && fav.i !== 1) leadBits.push(`أوضح مرشح: ${team(fav.i === 0 ? fav.f.home : fav.f.away).ar} بنسبة ${pct(fav.best)}.`);
    view.appendChild(ui().pageHead(day.today ? "اليوم" : "الجاي", leadBits.join(" "), null,
      `${D.meta.competition.name_ar} ${D.meta.competition.season_label}${md ? ` · الجولة ${md}` : ""} · ${ZS.dateLong(new Date(now))}`));

    const grid = h("div.grid.g-main");
    const left = h("div.stack-lg");
    const right = h("div.stack-lg");
    grid.append(left, right);
    view.appendChild(grid);

    // ---- matches of the day
    const prefs = ZS.store.prefs();
    const ordered = day.list.slice().sort((a, b) => {
      const w = (f) => (prefs.watchlist.includes(f.match_id) || prefs.fav_teams.includes(f.home) || prefs.fav_teams.includes(f.away) ? 0 : 1);
      return w(a) - w(b) || (a.kickoff_utc || "").localeCompare(b.kickoff_utc || "");
    });
    const cards = h("div.grid.g-2");
    for (const f of ordered) cards.appendChild(ui().matchCard(f, { prev: f.prev_p || null, line: f.takeaway_ar || "" }));
    left.appendChild(ui().section(day.label, ordered.length ? cards : ui().empty("ماكو مباريات بهالموعد"),
      h("a.more", { href: ZS.href("matches", md ? "md" + md : "") }, "كل مباريات الجولة ←")));

    // ---- latest results (last finished matches)
    const done = fx.filter((f) => f.score).sort((a, b) => (b.kickoff_utc || "").localeCompare(a.kickoff_utc || "")).slice(0, 4);
    if (done.length) {
      const g = h("div.grid.g-2");
      for (const f of done) g.appendChild(ui().matchCard(f, { compact: false }));
      left.appendChild(ui().section("آخر النتائج", g, h("a.more", { href: ZS.href("matches", "md" + done[0].matchday) }, "النتائج كاملة ←")));
    }

    // ---- right column: story, title race, relegation (loaded in parallel; each fails on its own)
    const storySlot = h("div", ui().skeleton(1, 160));
    const raceSlot = h("div", ui().skeleton(1, 200));
    const impSlot = h("div", ui().skeleton(1, 160));
    const recSlot = h("div", ui().skeleton(1, 120));
    right.append(storySlot, raceSlot);
    left.append(impSlot);
    right.append(recSlot);

    ZS.getJSON("stories.json").then((js) => {
      ZS.clear(storySlot);
      const s = (js.stories || [])[0];
      if (!s) { storySlot.appendChild(ui().section("قصة تستاهل النشر", ui().empty("ماكو قصة واضحة بالأرقام هسه"))); return; }
      storySlot.appendChild(ui().section("قصة تستاهل النشر", storyCard(s, true), h("a.more", { href: ZS.href("studio") }, "كل القصص ←")));
    }).catch((e) => { ZS.clear(storySlot); storySlot.appendChild(ui().errorCard(e)); });

    ZS.getJSON("season.json").then((s) => {
      ZS.clear(raceSlot);
      raceSlot.appendChild(racePanel(s));
      ZS.clear(impSlot);
      impSlot.appendChild(importancePanel(s));
    }).catch((e) => { ZS.clear(raceSlot); raceSlot.appendChild(ui().errorCard(e)); ZS.clear(impSlot); });

    ZS.getJSON("accuracy.json").then((a) => { ZS.clear(recSlot); recSlot.appendChild(recordPanel(a)); })
      .catch((e) => { ZS.clear(recSlot); recSlot.appendChild(ui().errorCard(e)); });
  }

  function storyCard(s, withActions) {
    return h("article.card.story-card",
      h("div.row", h("span.tag.led", storyType(s.type)), s.sample ? h("span.tag", `العينة: ${s.sample}`) : null),
      h("h3", s.title_ar),
      h("p", s.text_ar),
      h("div.ev", (s.evidence || []).map((e) => h("span", `${e.label_ar}: `, h("strong.num", String(e.value))))),
      h("p.tiny.faint", `المقارنة: ${s.comparison_ar} · الفترة: ${s.period_ar}`),
      s.caution_ar ? h("p.tiny.faint", `تنبيه: ${s.caution_ar}`) : null,
      withActions ? h("div.row",
        h("a.btn.small.primary", { href: ZS.href("studio", "story-" + s.id) }, ui().icon("studio"), "سوّي منها بطاقة ونص"),
        h("button.btn.small", { type: "button", onclick: () => saveStory(s) }, ui().icon("star"), "احفظها")) : null);
  }
  function storyType(t) {
    return ({ results_vs_level: "النتائج مقابل المستوى", rating_trend: "اتجاه المستوى", high_stakes: "مباراة تحسم", title_race: "سباق اللقب",
      half_shift: "شوط بوجهين", creator_without_output: "يصنع بدون حصيلة" })[t] || "قصة";
  }
  async function saveStory(s) {
    const list = ZS.store.list("stories").filter((x) => x.id !== s.id);
    list.unshift({ id: s.id, title_ar: s.title_ar, text_ar: s.text_ar, type: s.type, saved_at: new Date().toISOString(), note: "" });
    await ZS.store.saveList("stories", list.slice(0, 100));
    ZS.toast("انحفظت بالاستوديو");
  }

  function racePanel(s) {
    const rows = s.projection.slice().sort((a, b) => b.p_title - a.p_title).filter((r) => r.p_title >= 0.005).slice(0, 4);
    const rel = s.projection.slice().sort((a, b) => b.p_releg - a.p_releg).slice(0, 4);
    const bar = (r, key, col) => h("div", { style: { display: "grid", gridTemplateColumns: "minmax(0,1fr) 54px", gap: "8px", alignItems: "center" } },
      h("div.stack", { style: { gap: "3px" } },
        ui().teamInline(r.id),
        h("div", { style: { height: "7px", background: "var(--inset)", borderRadius: "4px", overflow: "hidden" } },
          h("i", { style: { display: "block", height: "100%", width: `${Math.max(1, 100 * r[key])}%`, background: col } }))),
      h("strong.num", { style: { textAlign: "end", fontFamily: "var(--font-display)", fontSize: "1.1rem" } }, pct(r[key])));
    return h("section.card",
      h("div.card-head", h("h2", "سباق اللقب"), h("a.small", { href: ZS.href("season") }, "الموسم كامل ←")),
      h("div.stack", rows.map((r) => bar(r, "p_title", "var(--title)"))),
      h("hr.sep"),
      h("h3", { style: { marginTop: "6px" } }, "خطر الهبوط"),
      h("div.stack", rel.map((r) => bar(r, "p_releg", "var(--releg)"))),
      h("p.tiny.faint", { style: { marginTop: "8px" } }, s.mc_note_ar));
  }

  function importancePanel(s) {
    const imp = (s.importance || []).slice(0, 5);
    if (!imp.length) return ui().section("أهم المباريات للموسم", ui().empty("ماكو مباريات بالأيام الجاية"));
    const mx = Math.max(...imp.map((i) => i.importance), 1);
    const list = h("ol.list", imp.map((i, k) => {
      const f = D.fixturesById.get(i.match_id);
      const sw = i.swings && i.swings[0];
      const metric = { p_title: "اللقب", p_ucl: "دوري الأبطال", p_releg: "الهبوط" }[sw && sw.metric] || "";
      return h("li",
        h("strong.num", { style: { fontFamily: "var(--font-display)", fontSize: "1.2rem", minWidth: "22px" } }, String(k + 1)),
        h("div.stack.grow", { style: { gap: "4px" } },
          h("a", { href: ZS.href("match", i.match_id), style: { color: "var(--fg)", fontWeight: 800 } }, `${team(i.home_id).ar} × ${team(i.away_id).ar}`),
          sw ? h("span.small.muted", `${team(sw.team_id).ar} ب${metric}: ${pct(sw.home_win)} إذا فاز ${team(i.home_id).ar} · ${pct(sw.draw)} تعادل · ${pct(sw.away_win)} إذا فاز ${team(i.away_id).ar}`) : null,
          h("div", { style: { height: "6px", background: "var(--inset)", borderRadius: "3px" } },
            h("i", { style: { display: "block", height: "100%", width: `${(100 * i.importance) / mx}%`, background: "var(--led)", borderRadius: "3px" } }))),
        f && f.kickoff_utc ? h("span.small.faint.nowrap", ZS.dateShort(f.kickoff_utc)) : null);
    }));
    return ui().section("أهم المباريات للموسم هالأسبوع",
      h("div.card", list, h("p.tiny.faint", "الأهمية = مجموع تغيّر فرص اللقب ودوري الأبطال والهبوط بين فوز صاحب الأرض وفوز الضيف (بنفس المحاكاة). يعني حجم الرهان، مو شهرة الفريقين.")));
  }

  function recordPanel(a) {
    const t = a.prematch.test;
    const disp = a.registry.displayed_track;
    const s = t.scores[disp], b = t.scores.bet365;
    const live = (a.live_record && a.live_record.summary) || [];
    const mine = live.find((r) => r.track === disp);
    return h("section.card",
      h("div.card-head", h("h2", "دقة الحاسوب"), h("a.small", { href: ZS.href("method") }, "المنهجية كاملة ←")),
      h("div.kpis",
        h("div.kpi", h("span.k-val.num", pct(s.hit, 1)), h("span.k-lab", "اختيار النتيجة (فوز/تعادل/خسارة)"), h("span.k-sub", `${t.n} مباراة · ${t.seasons} · Bet365 ${pct(b.hit, 1)}`)),
        h("div.kpi", h("span.k-val.num", mine ? `${pct(mine.hit)}` : "—"), h("span.k-lab", "السجل الحي من هالموسم"),
          h("span.k-sub", mine ? `${mine.n} مباراة مسجلة قبل البداية` : "يبدأ يتحسب بعد أول مباريات مسجلة"))),
      h("p.tiny.faint", { style: { marginTop: "8px" } }, "الرقم الأول من اختبار على مواسم ما شافها الموديل وقت الضبط. الثاني من التوقعات المسجلة قبل صافرة البداية فقط."));
  }

  ZS.routes.today = { render, title: "اليوم", storyCard, saveStory, storyType };
})();

/* ---- js/pages/matches.js ---- */
/* Matches: every fixture of the season by matchday, with results, forecasts and the retro check. */
(function () {
  "use strict";
  const ZS = window.ZS;
  const { h, pct, team, D } = ZS;
  const ui = () => ZS.ui;

  function currentMatchday(now = Date.now()) {
    const next = D.fixtures.filter((f) => !f.score && f.kickoff_utc && new Date(f.kickoff_utc).getTime() > now - 3 * 3600e3)
      .sort((a, b) => a.kickoff_utc.localeCompare(b.kickoff_utc))[0];
    if (next) return next.matchday;
    const last = D.fixtures.filter((f) => f.score).sort((a, b) => b.matchday - a.matchday)[0];
    return last ? last.matchday : 1;
  }

  const FILTERS = [
    ["all", "الكل"], ["fav", "فرقي"], ["watch", "المتابَعة"], ["played", "انتهت"], ["upcoming", "قادمة"],
  ];

  async function render(view, params) {
    const prefs = ZS.store.prefs();
    const saved = (prefs.filters && prefs.filters.matches) || {};
    let md = params.id && /^md\d+$/.test(params.id) ? Number(params.id.slice(2)) : currentMatchday();
    let filter = saved.filter || "all";
    const maxMd = Math.max(...D.fixtures.map((f) => f.matchday));

    const mdSelect = h("select#md-select", { "aria-label": "اختاري الجولة", style: { width: "auto", minWidth: "140px" } },
      Array.from({ length: maxMd }, (_, i) => h("option", { value: i + 1, selected: i + 1 === md }, `الجولة ${i + 1}`)));
    const prevBtn = h("button.icon-btn", { type: "button", "aria-label": "الجولة السابقة" }, ui().icon("back"));
    const nextBtn = h("button.icon-btn", { type: "button", "aria-label": "الجولة التالية", style: { transform: "scaleX(-1)" } }, ui().icon("back"));
    view.appendChild(ui().pageHead("المباريات", "كل مباريات الموسم بتوقيت بغداد. المباريات اللي انتهت تبيّن التوقع الاسترجاعي: نفس الموديل وبيانات ما قبل الأسبوع بس.",
      h("div.row", prevBtn, mdSelect, nextBtn), `${D.meta.competition.name_ar} ${D.meta.competition.season_label}`));
    const chips = h("div.chips.scroll", { role: "toolbar", "aria-label": "تصفية" });
    view.appendChild(chips);
    const body = h("div.stack-lg");
    view.appendChild(body);

    function draw() {
      ZS.clear(chips);
      for (const [k, lab] of FILTERS) {
        chips.appendChild(h("button.chip", { type: "button", "aria-pressed": String(filter === k), onclick: () => { filter = k; persist(); draw(); } }, lab));
      }
      ZS.clear(body);
      mdSelect.value = String(md);
      prevBtn.disabled = md <= 1; nextBtn.disabled = md >= maxMd;
      const p = ZS.store.prefs();
      let list = D.fixtures.filter((f) => f.matchday === md);
      if (filter === "fav") list = D.fixtures.filter((f) => p.fav_teams.includes(f.home) || p.fav_teams.includes(f.away));
      if (filter === "watch") list = D.fixtures.filter((f) => p.watchlist.includes(f.match_id));
      if (filter === "played") list = list.filter((f) => f.score);
      if (filter === "upcoming") list = list.filter((f) => !f.score);
      if ((filter === "fav" && !p.fav_teams.length)) { body.appendChild(ui().empty("ما اخترتي فرق مفضلة بعد. اختاريها من صفحة أي فريق أو من الإعدادات.")); return; }
      if ((filter === "watch" && !p.watchlist.length)) { body.appendChild(ui().empty("ماكو مباريات متابَعة. اضغطي «تابعي» بمركز أي مباراة.")); return; }
      if (!list.length) { body.appendChild(ui().empty("ماكو مباريات بهالتصفية")); return; }
      if (filter === "fav" || filter === "watch") body.appendChild(h("p.small.muted", "تشمل كل الجولات"));
      // summary of the matchday: retro accuracy of the displayed track
      const played = list.filter((f) => f.score && f.retro_hit !== undefined);
      if (filter !== "fav" && filter !== "watch" && played.length >= 3) {
        const hits = played.filter((f) => f.retro_hit).length;
        body.appendChild(h("div.notice.pitch", ui().icon("check"), h("span", `بهالجولة صار الاحتمال الأرجح بـ${hits} من ${played.length} مباريات (توقع استرجاعي بنفس الموديل).`)));
      }
      const groups = new Map();
      for (const f of list.slice().sort((a, b) => (a.kickoff_utc || a.kickoff_baghdad.date || "").localeCompare(b.kickoff_utc || b.kickoff_baghdad.date || ""))) {
        const key = f.kickoff_utc ? ZS.dayKey(f.kickoff_utc) : (f.kickoff_baghdad.date || "غير محدد");
        if (!groups.has(key)) groups.set(key, []);
